
   

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartStudy | StudentVerse</title>
<link rel="stylesheet" href="style.css">

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#0b0618;
 color:#fff;
 font-family:Arial,sans-serif;
}
.app{
 max-width:1000px;
 margin:auto;
 padding:20px;
}
header{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
 flex-wrap:wrap;
 margin-bottom:22px;
}
.logo{font-size:23px;font-weight:bold;color:#d9b5ff}
button,select,input{
 font:inherit;
}
button{
 border:1px solid #7651a7;
 background:#281644;
 color:white;
 padding:12px 16px;
 border-radius:12px;
 cursor:pointer;
}
button:hover{background:#633a91}
select,input{
 width:100%;
 padding:13px;
 border-radius:10px;
 border:1px solid #68458e;
 background:#160d26;
 color:white;
 margin:7px 0 15px;
}
.panel{
 background:#190f2b;
 border:1px solid #382451;
 border-radius:16px;
 padding:17px;
 margin:15px 0;
}
h1,h2,h3{color:#e3c5ff}
h1{font-size:25px}
h2{font-size:21px}
h3{font-size:17px}
.muted{color:#b8a8ca;font-size:14px}
.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
 gap:10px;
}
.option{
 text-align:left;
 min-height:55px;
}
.chapter{
 width:100%;
 text-align:left;
 margin:5px 0;
 background:#211333;
}
.content{
 line-height:1.75;
 color:#eee5f8;
 white-space:normal;
}
.content ul{padding-left:22px}
.content li{margin:6px 0}
.section{
 border-left:3px solid #a66bdf;
 padding:10px 14px;
 margin:14px 0;
 background:#211532;
 border-radius:8px;
}
.hidden{display:none}
.tag{
 display:inline-block;
 background:#3a2453;
 padding:5px 9px;
 border-radius:20px;
 font-size:12px;
 margin:3px;
}
.back{margin-bottom:12px}
.search{margin-top:12px}
footer{
 text-align:center;
 color:#9986ad;
 padding:25px 0;
 font-size:12px;
}
</style>
</head>

<body>
<div class="app">

<header>
 <div class="logo">✦ StudentVerse | SmartStudy</div>
 <button onclick="location.href='index.html'">← Home</button>
</header>

<div id="home">
 <h1>SmartStudy</h1>
 <p class="muted">Choose your board, class and subject to start learning.</p>

 <div class="panel">
  <h3>Select Board</h3>
  <div class="grid" id="boards"></div>
 </div>

 <div class="panel hidden" id="classPanel">
  <h3>Select Class</h3>
  <div class="grid" id="classes"></div>
 </div>

 <div class="panel hidden" id="subjectPanel">
  <h3>Select Subject</h3>
  <div class="grid" id="subjects"></div>
 </div>

 <div class="panel hidden" id="chapterPanel">
  <h3>Chapters</h3>
  <input class="search" id="chapterSearch"
   placeholder="Search chapter..."
   oninput="filterChapters()">
  <div id="chapters"></div>
 </div>
</div>

<div id="lessonPage" class="hidden">
 <button class="back" onclick="backToChapters()">← Back to Chapters</button>
 <div class="panel">
  <div class="muted" id="lessonPath"></div>
  <h1 id="lessonTitle"></h1>
  <div id="lessonContent" class="content"></div>
 </div>
</div>

<footer>StudentVerse SmartStudy</footer>
</div>

<script>
const $ = id => document.getElementById(id);

let selectedBoard="";
let selectedClass="";
let selectedSubject="";

const classOptions={
 CBSE:[6,7,8,9,10,11,12],
 ICSE:[6,7,8,9,10],
 ISC:[11,12]
};

/*
 Subject availability is a starting catalogue.
 Schools may offer different subject combinations.
*/

const subjectOptions={
 CBSE:{
  6:["English","Hindi","Mathematics","Science","Social Science","Sanskrit","Computer"],
  7:["English","Hindi","Mathematics","Science","Social Science","Sanskrit","Computer"],
  8:["English","Hindi","Mathematics","Science","Social Science","Sanskrit","Computer"],
  9:["English","Hindi","Mathematics","Science","Social Science","Information Technology"],
  10:["English","Hindi","Mathematics","Science","Social Science","Information Technology"],
  11:["English","Physics","Chemistry","Mathematics","Biology","Accountancy","Business Studies","Economics","Computer Science","Political Science","History","Geography","Psychology"],
  12:["English","Physics","Chemistry","Mathematics","Biology","Accountancy","Business Studies","Economics","Computer Science","Political Science","History","Geography","Psychology"]
 },
 ICSE:{
  6:["English","Hindi","Mathematics","Physics","Chemistry","Biology","History","Geography","Computer Studies"],
  7:["English","Hindi","Mathematics","Physics","Chemistry","Biology","History","Geography","Computer Studies"],
  8:["English","Hindi","Mathematics","Physics","Chemistry","Biology","History","Geography","Computer Studies"],
  9:["English Language","English Literature","Hindi","Mathematics","Physics","Chemistry","Biology","History and Civics","Geography","Computer Applications"],
  10:["English Language","English Literature","Hindi","Mathematics","Physics","Chemistry","Biology","History and Civics","Geography","Computer Applications"]
 },
 ISC:{
  11:["English","Physics","Chemistry","Mathematics","Biology","Computer Science","Accounts","Commerce","Economics","History","Political Science","Psychology"],
  12:["English","Physics","Chemistry","Mathematics","Biology","Computer Science","Accounts","Commerce","Economics","History","Political Science","Psychology"]
 }
};

/*
 Chapter names and detailed learning content are stored here.
 Add each verified chapter as a separate entry.
*/

const lessonData={

 "CBSE|6|Mathematics|Knowing Our Numbers":{
  summary:"This chapter introduces numbers, their comparison, place value and methods of calculation.",
  topics:[
   {
    name:"Large Numbers",
    explanation:"Large numbers are numbers containing many digits. We use place value to read and write them correctly. In the Indian system, digits are grouped into ones, thousands, lakhs and crores.",
    definitions:[
     ["Place Value","The value of a digit according to its position in a number."],
     ["Face Value","The digit itself, irrespective of its position."]
    ],
    formulas:["Place value = Digit × Value of its position"],
    examples:[
     ["Find the place value of 5 in 3,52,418.","The digit 5 is in the ten-thousands place. Its place value is 50,000."]
    ],
    important:["Always identify the position of a digit before finding its place value.","Use commas according to the Indian or International system."],
    revision:["Face value is the digit itself.","Place value depends on position.","Indian grouping: 3,52,418."]
   },
   {
    name:"Comparing Numbers",
    explanation:"To compare two numbers, first compare their number of digits. A number with more digits is greater. If both have the same number of digits, compare digits from left to right.",
    definitions:[
     ["Ascending Order","Arranging numbers from smallest to largest."],
     ["Descending Order","Arranging numbers from largest to smallest."]
    ],
    formulas:["For equal-length numbers, compare digits from the highest place value first."],
    examples:[
     ["Arrange 452, 524 and 425 in ascending order.","425 < 452 < 524."]
    ],
    important:["Start comparison from the leftmost digit.","Do not compare only the last digit."],
    revision:["Ascending means increasing.","Descending means decreasing."]
   }
  ]
 },

 "CBSE|6|Mathematics|Whole Numbers":{
  summary:"Whole numbers include zero and all natural numbers. They are used for counting and calculations.",
  topics:[
   {
    name:"Natural and Whole Numbers",
    explanation:"Natural numbers are 1, 2, 3, 4 and so on. When zero is included, the collection is called whole numbers.",
    definitions:[
     ["Natural Numbers","Counting numbers beginning with 1."],
     ["Whole Numbers","Natural numbers together with zero."]
    ],
    formulas:["Whole numbers = {0,1,2,3,4,...}"],
    examples:[
     ["Is 0 a whole number?","Yes. Zero is a whole number, but it is not a natural number under the usual school definition."]
    ],
    important:["Every natural number is a whole number.","Zero is the smallest whole number."],
    revision:["Natural numbers start at 1.","Whole numbers start at 0."]
   },
   {
    name:"Properties of Whole Numbers",
    explanation:"Addition and multiplication of whole numbers follow useful properties such as closure, commutativity, associativity and distributivity.",
    definitions:[
     ["Commutative Property","Changing the order of numbers does not change the result for addition or multiplication."],
     ["Associative Property","Changing the grouping does not change the result for addition or multiplication."],
     ["Distributive Property","Multiplication distributes over addition."]
    ],
    formulas:["a + b = b + a","a × b = b × a","(a+b)+c = a+(b+c)","a × (b+c) = ab + ac"],
    examples:[
     ["Use distributive property for 7 × 13.","7 × (10+3) = 70+21 = 91."]
    ],
    important:["Subtraction is not commutative.","Division is not commutative."],
    revision:["Addition and multiplication are commutative.","Multiplication distributes over addition."]
   }
  ]
 },

 "CBSE|6|Science|Components of Food":{
  summary:"Food contains nutrients that provide energy, support growth and help the body remain healthy.",
  topics:[
   {
    name:"Nutrients",
    explanation:"Nutrients are useful substances present in food. The major nutrients are carbohydrates, proteins, fats, vitamins and minerals. Water and roughage are also important parts of a balanced diet.",
    definitions:[
     ["Carbohydrates","Nutrients that are a major source of energy."],
     ["Proteins","Nutrients needed for growth and repair of body tissues."],
     ["Fats","Energy-rich nutrients that also help in insulation and other body functions."],
     ["Vitamins","Protective nutrients needed in small amounts for normal body functions."],
     ["Minerals","Inorganic nutrients needed for healthy growth and body processes."],
     ["Roughage","Dietary fibre that helps food move through the digestive system."]
    ],
    formulas:[],
    examples:[
     ["Name foods rich in carbohydrates.","Rice, wheat, potatoes and bread."],
     ["Name foods rich in proteins.","Pulses, beans, milk, eggs and nuts."]
    ],
    important:["A balanced diet contains different nutrients in suitable amounts.","Water is essential for body functions.","No single food provides every nutrient in the required amount."],
    revision:["Carbohydrates: energy.","Proteins: growth and repair.","Fats: stored energy and insulation.","Vitamins and minerals: normal body functions."]
   },
   {
    name:"Tests for Food Components",
    explanation:"Some food components can be identified using simple classroom tests. Iodine solution is used to test for starch. A greasy translucent spot on paper can indicate fats.",
    definitions:[
     ["Starch Test","A test in which iodine solution turns blue-black in the presence of starch."]
    ],
    formulas:[],
    examples:[
     ["What happens when iodine is added to a food sample containing starch?","The sample turns blue-black."]
    ],
    important:["Perform food tests only with teacher supervision.","Do not taste laboratory samples."],
    revision:["Iodine + starch gives a blue-black colour.","A translucent greasy spot may indicate fat."]
   }
  ]
 },

 "CBSE|7|Science|Nutrition in Plants":{
  summary:"Plants prepare their own food through photosynthesis. This chapter explains autotrophic and heterotrophic nutrition.",
  topics:[
   {
    name:"Photosynthesis",
    explanation:"Green plants prepare food using carbon dioxide and water in the presence of sunlight and chlorophyll. This process is called photosynthesis. Oxygen is released during the process.",
    definitions:[
     ["Photosynthesis","The process by which green plants make food using sunlight, carbon dioxide and water."],
     ["Chlorophyll","The green pigment that absorbs light energy in plants."]
    ],
    formulas:["Carbon dioxide + Water —(sunlight and chlorophyll)→ Glucose + Oxygen"],
    examples:[
     ["Why are leaves generally called food factories?","Because leaves contain chlorophyll and are the main sites of photosynthesis."]
    ],
    important:["Sunlight provides energy.","Roots absorb water from the soil.","Leaves take in carbon dioxide through stomata."],
    revision:["Photosynthesis requires sunlight, water, carbon dioxide and chlorophyll.","Oxygen is released."]
   },
   {
    name:"Modes of Nutrition",
    explanation:"Organisms obtain food in different ways. Autotrophs prepare their own food, while heterotrophs depend on other organisms for food.",
    definitions:[
     ["Autotrophs","Organisms that prepare their own food."],
     ["Heterotrophs","Organisms that depend on other organisms for food."]
    ],
    formulas:[],
    examples:[
     ["Give one example of a parasite in plants.","Cuscuta is a parasitic plant."]
    ],
    important:["Green plants are generally autotrophic.","Animals are heterotrophic.","Some plants obtain nutrients from other organisms."],
    revision:["Autotrophic = self-feeding.","Heterotrophic = depends on other organisms."]
   }
  ]
 }

};

function makeButton(label,fn){
 const b=document.createElement("button");
 b.textContent=label;
 b.className="option";
 b.onclick=fn;
 return b;
}

function resetPanels(){
 ["classPanel","subjectPanel","chapterPanel"].forEach(id=>{
  $(id).classList.add("hidden");
 });
 $("chapters").innerHTML="";
}

function selectBoard(board){
 selectedBoard=board;
 selectedClass="";
 selectedSubject="";
 resetPanels();

 $("classPanel").classList.remove("hidden");
 $("classes").innerHTML="";

 classOptions[board].forEach(c=>{
  $("classes").appendChild(
   makeButton("Class "+c,()=>selectClass(c))
  );
 });
}

function selectClass(c){
 selectedClass=c;
 selectedSubject="";
 $("subjectPanel").classList.remove("hidden");
 $("chapterPanel").classList.add("hidden");
 $("subjects").innerHTML="";

 subjectOptions[selectedBoard][c].forEach(subject=>{
  $("subjects").appendChild(
   makeButton(subject,()=>selectSubject(subject))
  );
 });
}

function selectSubject(subject){
 selectedSubject=subject;
 $("chapterPanel").classList.remove("hidden");
 $("chapterSearch").value="";

 const keys=Object.keys(lessonData).filter(key=>{
  const p=key.split("|");
  return p[0]===selectedBoard &&
         p[1]===String(selectedClass) &&
         p[2]===selectedSubject;
 });

 const chapterNames=keys.map(key=>key.split("|")[3]);
 renderChapters(chapterNames);
}

function renderChapters(list){
 $("chapters").innerHTML="";

 if(!list.length){
  $("chapters").innerHTML=
   '<div class="section">Chapter-wise verified study material has not yet been added for this subject. No invented chapter list or generic notes are being shown.</div>';
  return;
 }

 list.forEach(ch=>{
  const b=document.createElement("button");
  b.className="chapter";
  b.textContent="📘 "+ch;
  b.onclick=()=>openChapter(ch);
  $("chapters").appendChild(b);
 });
}

function filterChapters(){
 const q=$("chapterSearch").value.toLowerCase();
 const keys=Object.keys(lessonData).filter(key=>{
  const p=key.split("|");
  return p[0]===selectedBoard &&
         p[1]===String(selectedClass) &&
         p[2]===selectedSubject &&
         p[3].toLowerCase().includes(q);
 });
 renderChapters(keys.map(k=>k.split("|")[3]));
}

function escapeHTML(value){
 return String(value).replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#39;"
 })[c]);
}

function makeList(items){
 if(!items || !items.length) return "<p>Not applicable for this topic.</p>";
 return "<ul>"+items.map(x=>"<li>"+escapeHTML(x)+"</li>").join("")+"</ul>";
}

function openChapter(ch){
 const key=[selectedBoard,selectedClass,selectedSubject,ch].join("|");
 const data=lessonData[key];

 if(!data) return;

 $("home").classList.add("hidden");
 $("lessonPage").classList.remove("hidden");

 $("lessonPath").textContent=
  selectedBoard+" • Class "+selectedClass+" • "+selectedSubject;

 $("lessonTitle").textContent=ch;

 let html=`
 <div class="section">
 <h2>Chapter Summary</h2>
 <p>${escapeHTML(data.summary)}</p>
 </div>
 `;

 data.topics.forEach((topic,index)=>{
  html+=`
  <div class="section">
   <span class="tag">Topic ${index+1}</span>
   <h2>${escapeHTML(topic.name)}</h2>

   <h3>Detailed Explanation</h3>
   <p>${escapeHTML(topic.explanation)}</p>

   <h3>Definitions</h3>
   ${topic.definitions.map(d=>
    `<p><b>${escapeHTML(d[0])}:</b> ${escapeHTML(d[1])}</p>`
   ).join("")}

   <h3>Formulas</h3>
   ${makeList(topic.formulas)}

   <h3>Solved Examples</h3>
   ${topic.examples.map(e=>
    `<p><b>Question:</b> ${escapeHTML(e[0])}<br>
    <b>Solution:</b> ${escapeHTML(e[1])}</p>`
   ).join("")}

   <h3>Important Points</h3>
   ${makeList(topic.important)}

   <h3>Quick Revision</h3>
   ${makeList(topic.revision)}
  </div>
  `;
 });

 $("lessonContent").innerHTML=html;
 window.scrollTo(0,0);
}

function backToChapters(){
 $("lessonPage").classList.add("hidden");
 $("home").classList.remove("hidden");
 $("chapterPanel").classList.remove("hidden");
 window.scrollTo(0,0);
}

["CBSE","ICSE","ISC"].forEach(board=>{
 $("boards").appendChild(
  makeButton(board,()=>selectBoard(board))
 );
});
</script>
</body>
</html>
