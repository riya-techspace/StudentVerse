body{

.app{

header{

.logo{

button,select,input{font:inherit}

button{

 padding:12px 16px;

button:hover{background:#633a91}

select,input{

.panel{

}

h1,h2,h3{color:#e3c5ff}

h1{font-size:26px}
h2{font-size:21px}
h3{font-size:17px}

.muted{

 line-height:1.6;
}

.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
 gap:10px;
}

.option{
 text-align:left;
 min-height:55px;
}

.chapter{
 width:100%;
 text-align:left;
 margin:5px 0;
 background:#211333;
}

.content{
 line-height:1.75;
 color:#eee5f8;
}

.section{
 border-left:3px solid #a66bdf;
 padding:12px 14px;
 margin:14px 0;
 background:#211532;
 border-radius:8px;
}

.section p{margin:7px 0}

.tag{
 display:inline-block;
 background:#3a2453;
 padding:5px 9px;
 border-radius:20px;
 font-size:12px;
 margin:3px;
}

.hidden{display:none}

.back{margin-bottom:12px}

footer{
 text-align:center;
 color:#9986ad;
 padding:25px 0;
 font-size:12px;
}

.empty{
 padding:15px;
 color:#b8a8ca;
 text-align:center;
}

@media(max-width:500px){
 .app{padding:13px}
 h1{font-size:23px}
}
</style>
</head>

function svSelectClass(cls) {
  svClass = String(cls);

  const subjects = [...new Set(
    Object.keys(lessonData)
      .filter(key => {
        const p = key.split("|");
        return p[0] === svBoard && p[1] === svClass;
      })
      .map(key => key.split("|")[2])
  )];

  svPanel("subjectPanel");

  const target = document.getElementById("subjects");
  if (!target) return;

  target.innerHTML = subjects.length
    ? subjects.map(subject => `
        <button class="item-card"
          onclick="svSelectSubject('${svEscape(subject)}')">
          <h3>${svEscape(subject)}</h3>
          <p>Open study material</p>
        </button>
      `).join("")
    : "<p>Study material is being prepared.</p>";
}

function svSelectSubject(subject) {
  svSubject = subject;
  svPanel("chapterPanel");
  svRenderChapters();
}

function svRenderChapters() {
  const search = (
    document.getElementById("chapterSearch")?.value || ""
  ).toLowerCase().trim();

  const chapters = Object.keys(lessonData)
    .filter(key => {
      const p = key.split("|");
      return p[0] === svBoard &&
        p[1] === svClass &&
        p[2] === svSubject;
    })
    .map(key => key.split("|")[3])
    .filter(name => name && name.toLowerCase().includes(search));

  const target = document.getElementById("chapters");
  if (!target) return;

  target.innerHTML = chapters.length
    ? chapters.map((chapter, i) => `
        <button class="item-card"
          onclick="svRenderChapter('${svEscape(chapter).replace(/'/g, '&#39;')}')">
          <span>Chapter ${i + 1}</span>
          <h3>${svEscape(chapter)}</h3>
          <p>Read notes and important questions</p>
        </button>
      `).join("")
    : "<p>No matching chapters found.</p>";
}

function svRenderValue(value) {
  if (value === null || value === undefined) return "";

  if (Array.isArray(value)) {
    return "<ul>" + value.map(item =>
      "<li>" + svRenderValue(item) + "</li>"
    ).join("") + "</ul>";
  }

  if (typeof value === "object") {
    return "<ul>" + Object.entries(value).map(([key, val]) =>
      "<li><strong>" + svEscape(key) + ":</strong> " +
      svRenderValue(val) + "</li>"
    ).join("") + "</ul>";
  }

  return svEscape(value);
}

function svSection(title, value) {
  if (value === undefined || value === null || value === "") {
    return "";
  }

  return `
    <section class="note-section">
      <h3>${svEscape(title)}</h3>
      ${svRenderValue(value)}
    </section>
  `;
}

function svRenderChapter(chapter) {
  const key = `${svBoard}|${svClass}|${svSubject}|${chapter}`;
  const data = lessonData[key];

  if (!data) {
    alert("Notes for this chapter are not available yet.");
    return;
  }

  svPanel("lessonPage");

  const path = document.getElementById("lessonPath");
  const title = document.getElementById("lessonTitle");
  const content = document.getElementById("lessonContent");

  if (path) {
    path.textContent =
      `${svBoard} / Class ${svClass} / ${svSubject}`;
  }

  if (title) title.textContent = chapter;
  if (!content) return;

  let html = `
    <section class="lesson-intro">
      <h2>Chapter Overview</h2>
      <p>${svEscape(data.summary || "Explore this chapter.")}</p>
    </section>
  `;

  if (Array.isArray(data.topics)) {
    data.topics.forEach((topic, index) => {
      if (typeof topic === "string") {
        html += `<section class="topic-card">
          <h2>${svEscape(topic)}</h2>
        </section>`;
        return;
      }

      html += `
        <section class="topic-card">
          <h2>${index + 1}. ${svEscape(topic.name || "Topic")}</h2>
          ${svSection("Explanation", topic.explanation)}
          ${svSection("Definitions", topic.definitions)}
          ${svSection("Important Points", topic.importantPoints)}
          ${svSection("Formulas", topic.formulas)}
          ${svSection("Examples", topic.examples)}
          ${svSection("Key Concepts", topic.concepts)}
        </section>
      `;
    });
  }

  html += svSection("Important Formulas", data.formulas);
  html += svSection("Important Definitions", data.definitions);
  html += svSection("Quick Revision", data.revision);
  html += svSection("Important Questions", data.questions);
  html += svSection("Answers", data.answers);

  content.innerHTML = html;
}

function filterChapters() {
  svRenderChapters();
}

function backToChapters() {
  svPanel("chapterPanel");
  svRenderChapters();
}

// Make functions available to HTML buttons
window.svSelectBoard = svSelectBoard;
window.svSelectClass = svSelectClass;
window.svSelectSubject = svSelectSubject;
window.svRenderChapter = svRenderChapter;
window.filterChapters = filterChapters;
window.backToChapters = backToChapters;

// Start app
svRenderBoards();

</script>
</body>
</html>
