body{

.app{

header{

.logo{

button,select,input{font:inherit}

button{

 padding:12px 16px;

button:hover{background:#633a91}

select,input{

.panel{

}

h1,h2,h3{color:#e3c5ff}

h1{font-size:26px}
h2{font-size:21px}
h3{font-size:17px}

.muted{

 line-height:1.6;
}

.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
 gap:10px;
}

.option{
 text-align:left;
 min-height:55px;
}

.chapter{
 width:100%;
 text-align:left;
 margin:5px 0;
 background:#211333;
}

.content{
 line-height:1.75;
 color:#eee5f8;
}

.section{
 border-left:3px solid #a66bdf;
 padding:12px 14px;
 margin:14px 0;
 background:#211532;
 border-radius:8px;
}

.section p{margin:7px 0}

.tag{
 display:inline-block;
 background:#3a2453;
 padding:5px 9px;
 border-radius:20px;
 font-size:12px;
 margin:3px;
}

.hidden{display:none}

.back{margin-bottom:12px}

footer{
 text-align:center;
 color:#9986ad;
 padding:25px 0;
 font-size:12px;
}

.empty{
 padding:15px;
 color:#b8a8ca;
 text-align:center;
}

@media(max-width:500px){
 .app{padding:13px}
 h1{font-size:23px}
}
</style>
</head>
