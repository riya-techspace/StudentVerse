"CBSE|8|Social Science|The Colonial Era in India": {
 summary:"Understand European trading companies, the expansion of British rule, colonial administration and its effects on Indian society and economy.",
 topics:[
  {name:"Arrival of European Trading Companies",explanation:"European companies came to India mainly for trade. Over time, the English East India Company gained political influence and began controlling territories.",definitions:[["Colonialism","Control of one territory by an outside power for political or economic advantage."],["East India Company","An English trading company that later became a major political power in India."],["Trade","Buying and selling goods and services."]],formulas:[],examples:[["Why did European companies come to India?","They wanted access to valuable goods and trade networks."]],important:["European trade expanded through coastal settlements.","The East India Company gradually gained political power.","Trade and political control became closely connected."],revision:["A trading company gradually became a ruling power."]},
  {name:"Expansion of British Rule",explanation:"The Company expanded its control through wars, treaties, alliances and administrative policies. The Battle of Plassey in 1757 and the Battle of Buxar in 1764 were important events in this process.",definitions:[["Battle of Plassey","The 1757 battle that strengthened Company influence in Bengal."],["Battle of Buxar","The 1764 battle that further strengthened Company power."],["Diwani","The right to collect revenue, granted to the Company in Bengal, Bihar and Orissa in 1765."]],formulas:[],examples:[["Why was the grant of Diwani important?","It gave the Company major revenue-collection rights and strengthened its political and financial position."]],important:["Company expansion was not a single event.","Revenue collection supported the Company's administration and military.","Indian rulers and communities responded in different ways."],revision:["Military victories and revenue rights helped the Company expand."]},
  {name:"Colonial Administration and Society",explanation:"British rule changed land revenue systems, administration, trade and many aspects of Indian society. Colonial policies affected farmers, artisans and local industries in different ways.",definitions:[["Land revenue","Tax collected from land and agricultural production."],["Colonial administration","Government systems established by a colonial power."],["Artisan","A skilled worker who makes goods by hand or with specialised tools."]],formulas:[],examples:[["How could high revenue demands affect farmers?","Farmers could face debt and financial pressure, especially during poor harvests."]],important:["Colonial policies changed traditional economic arrangements.","Indian textiles and crafts faced changing market conditions.","Different communities experienced colonial rule differently."],revision:["Colonial rule transformed India's economy, administration and society."]},
  {name:"Resistance and the Revolt of 1857",explanation:"Many groups resisted Company policies. The Revolt of 1857 involved soldiers, rulers, peasants and other sections of society. After the revolt, the British Crown took direct control of India in 1858.",definitions:[["Revolt","An organised act of resistance against authority."],["Sepoy","An Indian soldier serving in a European-style army."],["Crown rule","Direct rule by the British monarch through the British government."]],formulas:[],examples:[["What changed after the Revolt of 1857?","The East India Company's rule ended and the British Crown assumed direct control in 1858."]],important:["The revolt had many political, military and social causes.","Different regions and groups participated in different ways.","The revolt changed the structure of British rule in India."],revision:["The events of 1857 led to a major change in colonial administration."]}
 ]
},

"CBSE|8|Social Science|Universal Franchise and India's Electoral System": {
 summary:"Learn democratic elections, universal adult franchise, constituencies, voting and the role of the Election Commission of India.",
 topics:[
  {name:"Universal Adult Franchise",explanation:"Universal adult franchise means that every eligible adult citizen has the right to vote without discrimination based on wealth, gender, religion or social status, subject to constitutional and legal rules.",definitions:[["Universal adult franchise","The right of eligible adult citizens to vote."],["Democracy","A system of government in which people participate in choosing their representatives."],["Elector","A person who is eligible to vote."]],formulas:[],examples:[["Why is universal adult franchise important?","It gives citizens an equal voice in choosing their representatives."]],important:["India follows universal adult suffrage for eligible citizens aged 18 and above.","Each eligible voter has one vote.","Voting rights support political equality."],revision:["Universal franchise gives eligible adult citizens equal voting rights."]},
  {name:"Constituencies and Elections",explanation:"A constituency is a defined geographical area whose voters elect a representative. Elections allow citizens to choose representatives at different levels of government.",definitions:[["Constituency","An area whose voters elect a representative."],["Candidate","A person contesting an election."],["Secret ballot","A voting method that protects the privacy of a voter's choice."],["Electoral roll","The official list of registered eligible voters."]],formulas:[],examples:[["Why is a secret ballot important?","It allows voters to choose freely without pressure or intimidation."]],important:["Voters should check their names on the electoral roll.","Elections should be free and fair.","The secret ballot protects voter privacy."],revision:["Constituencies organise representation and elections."]},
  {name:"Election Commission of India",explanation:"The Election Commission of India is a constitutional body responsible for conducting elections to Parliament, State Legislatures and the offices of the President and Vice-President.",definitions:[["Election Commission of India","The constitutional authority responsible for conducting specified elections in India."],["Model Code of Conduct","Guidelines for political parties and candidates during elections."],["Electronic Voting Machine","A device used to record votes electronically."]],formulas:[],examples:[["What is the purpose of the Model Code of Conduct?","It promotes fair behaviour by parties and candidates during elections."]],important:["The Election Commission supervises the election process.","Voter identity and election procedures are protected by rules.","Citizens should participate responsibly."],revision:["The Election Commission helps ensure free and fair elections."]}
 ]
},

"CBSE|8|Social Science|The Parliamentary System: Legislature and Executive": {
 summary:"Understand India's parliamentary democracy, the two Houses of Parliament, law-making and the relationship between the legislature and executive.",
 topics:[
  {name:"The Legislature and Parliament",explanation:"The legislature makes laws and represents citizens. India's Parliament consists of the President and two Houses: the Lok Sabha and the Rajya Sabha.",definitions:[["Legislature","The institution responsible for making laws."],["Lok Sabha","The House of the People, whose members are directly elected."],["Rajya Sabha","The Council of States, which represents states and certain Union Territories."],["Bicameral legislature","A legislature with two Houses."]],formulas:[],examples:[["Which House is directly elected by citizens?","The Lok Sabha."]],important:["Parliament has two Houses.","The Lok Sabha normally has a five-year term unless dissolved earlier.","The Rajya Sabha is a permanent House and is not dissolved."],revision:["Parliament consists of the President, Lok Sabha and Rajya Sabha."]},
  {name:"The Executive",explanation:"The executive implements laws and runs the administration. In India's parliamentary system, the President is the constitutional head of the Union, while the Prime Minister and Council of Ministers exercise executive authority according to the Constitution.",definitions:[["Executive","The branch of government responsible for implementing laws and policies."],["Prime Minister","The head of the Council of Ministers at the Union level."],["Council of Ministers","The group of ministers that assists and advises the President, headed by the Prime Minister."],["Collective responsibility","The principle that the Council of Ministers is collectively responsible to the Lok Sabha."]],formulas:[],examples:[["What is the main role of the executive?","To implement laws and carry out government policies."]],important:["The President is the constitutional head of the Union.","The Prime Minister leads the Council of Ministers.","The Council of Ministers is collectively responsible to the Lok Sabha."],revision:["The legislature makes laws; the executive implements them."]},
  {name:"How Parliament Works",explanation:"Parliament discusses public issues, examines government actions, passes laws and approves public expenditure. Members ask questions and participate in debates.",definitions:[["Bill","A proposed law presented for consideration by the legislature."],["Act","A bill that has completed the required law-making process and received assent."],["Question Hour","A period in which members ask questions to ministers."],["Budget","A statement of estimated government receipts and expenditure."]],formulas:[],examples:[["Why are parliamentary debates important?","They allow representatives to discuss issues, question the government and examine proposed laws."]],important:["A bill must pass through the required constitutional process.","Parliament holds the executive accountable.","The budget explains government financial plans."],revision:["Parliament makes laws, discusses issues and holds the government accountable."]}
 ]

{name:"Decimal Expansion and Number Line",explanation:"Every real number can be represented by a point on the number line. Rational numbers have terminating or recurring decimal expansions.",definitions:["Terminating Decimal: A decimal that ends.","Recurring Decimal: A decimal with repeating digits.","Non-recurring Decimal: A decimal without a repeating pattern."],formulas:["A rational number p/q has a terminating decimal expansion when the prime factors of q, in lowest terms, are only 2 and/or 5."],examples:["1/4 = 0.25","1/3 = 0.333...","√2 has a non-terminating, non-recurring decimal expansion."],important:["Irrational numbers have non-terminating, non-recurring decimal expansions.","A square root of a positive integer that is not a perfect square is irrational."],revision:"Decimal expansion helps distinguish rational and irrational numbers."}

"CBSE|9|Mathematics|Propositions and their Converses": {
summary:"This chapter introduces mathematical propositions, conditional statements, converses and counterexamples. It develops logical reasoning and helps students distinguish between true and false mathematical statements.",
topics:[
{name:"Propositions and If-Then Statements",explanation:"A proposition is a declarative statement that is either true or false. A conditional statement connects two parts using the form 'If P, then Q'. Here P is the hypothesis and Q is the conclusion.",definitions:["Proposition: A statement that has a definite truth value.","Hypothesis: The condition given in an if-then statement.","Conclusion: The result claimed by the statement.","Conditional Statement: A statement written in the form If P, then Q."],formulas:["If P, then Q is written as P → Q."],examples:["If a number is divisible by 4, then it is even.","If a figure is a square, then it has four equal sides."],important:["A proposition must have a definite truth value.","A mathematical question is not a proposition.","Check the hypothesis and conclusion separately."],revision:"A proposition is either true or false. A conditional statement has a hypothesis and a conclusion."},
{name:"Converse and Counterexamples",explanation:"The converse of 'If P, then Q' is 'If Q, then P'. A true statement does not always have a true converse. A counterexample is a specific example that proves a general statement false.",definitions:["Converse: The statement obtained by interchanging the hypothesis and conclusion.","Counterexample: An example that disproves a statement.","Implication: A logical relationship between statements."],formulas:["Original: P → Q.","Converse: Q → P."],examples:["Original: If a number is divisible by 4, it is even. Converse: If a number is even, it is divisible by 4. The converse is false because 6 is even but not divisible by 4."],important:["The converse may be false even when the original statement is true.","One valid counterexample is enough to disprove a universal claim."],revision:"Interchange P and Q to form the converse. Use a counterexample to disprove a false statement."}
]

"CBSE|9|Mathematics|How Quantities Combine: Understanding Data": {
summary:"This chapter explores how quantities combine and how data can be organised, represented and interpreted. It introduces averages, weighted averages, mixtures and graphical representations.",
topics:[
{name:"Organising and Interpreting Data",explanation:"Data consists of collected information. Organising data into tables and charts makes it easier to identify patterns, compare values and draw conclusions.",definitions:["Data: A collection of facts or observations.","Frequency: The number of times a value occurs.","Mean: The arithmetic average of observations.","Range: The difference between the highest and lowest values."],formulas:["Mean = Sum of all observations / Number of observations.","Range = Maximum value − Minimum value."],examples:["For 2, 4, 6, 8: Mean = (2+4+6+8)/4 = 5."],important:["Arrange data carefully before calculating.","Always check the number of observations.","Do not confuse frequency with the value itself."],revision:"Tables and averages help summarise and understand data."},
{name:"Weighted Average and Mixtures",explanation:"A weighted average gives different importance to different values. In mixtures, the combined average depends on the quantities and their respective values.",definitions:["Weighted Average: An average in which observations have different weights.","Mixture: A combination of two or more quantities.","Weight: The importance or quantity assigned to a value."],formulas:["Weighted Mean = Σ(wx) / Σw.","For two quantities: Combined Mean = (n₁x₁+n₂x₂)/(n₁+n₂)."],examples:["A student scores 70 in a test of weight 2 and 80 in a test of weight 3. Weighted mean = (70×2+80×3)/(2+3) = 76."],important:["Multiply each value by its weight.","Divide by the sum of weights.","Keep units consistent."],revision:"A weighted average accounts for the relative importance or quantity of each value."},
{name:"Bar Graphs and Data Representation",explanation:"Bar graphs represent categories using rectangular bars. Stacked bar charts show how different parts contribute to a total.",definitions:["Bar Graph: A graph using bars to compare categories.","Stacked Bar Chart: A bar divided into sections representing different components.","Category: A group or type of data."],formulas:["Percentage = (Part / Whole) × 100."],examples:["A class has 20 boys and 30 girls. Total students = 50. Percentage of girls = 60%."],important:["Choose a suitable scale.","Label both axes clearly.","The height of a bar must match its value."],revision:"Graphs make comparisons and proportions easier to understand."}
]

"CBSE|9|Mathematics|The World of Algorithms": {
summary:"This chapter introduces algorithms as step-by-step procedures for solving problems. It explores logical steps, divisibility, the greatest common divisor and the efficiency of methods.",
topics:[
{name:"Introduction to Algorithms",explanation:"An algorithm is a finite sequence of clearly defined steps used to solve a problem or complete a task. A good algorithm produces the required result and eventually terminates.",definitions:["Algorithm: A finite sequence of precise steps for solving a problem.","Input: Information supplied to an algorithm.","Output: The result produced by an algorithm.","Termination: The point at which an algorithm stops."],formulas:[],examples:["To find the larger of two numbers: input two numbers, compare them, display the larger number."],important:["Steps should be clear and unambiguous.","An algorithm must terminate.","The output should solve the given problem."],revision:"An algorithm is a clear, finite and systematic problem-solving procedure."},
{name:"Greatest Common Divisor",explanation:"The greatest common divisor (GCD) of two or more integers is the greatest positive integer that divides each of them exactly.",definitions:["Factor: A number that divides another number exactly.","Common Factor: A factor shared by two or more numbers.","GCD: The greatest common positive factor of given integers."],formulas:["For positive integers a and b, GCD(a,b) is their greatest common divisor."],examples:["Factors of 12: 1,2,3,4,6,12. Factors of 18: 1,2,3,6,9,18. Therefore GCD(12,18)=6."],important:["The GCD cannot be greater than the smaller positive number.","A common divisor divides every given number."],revision:"The GCD is the largest positive integer that divides all the given integers."},
{name:"Euclid's Algorithm",explanation:"Euclid's algorithm finds the GCD by repeatedly dividing the larger number by the smaller number and replacing the pair with the divisor and remainder.",definitions:["Dividend: The number being divided.","Divisor: The number by which another number is divided.","Remainder: The amount left after division."],formulas:["If a=bq+r, then GCD(a,b)=GCD(b,r).","Continue until the remainder becomes 0. The last non-zero remainder is the GCD."],examples:["Find GCD(48,18): 48=18×2+12; 18=12×1+6; 12=6×2+0. Therefore GCD=6."],important:["Use the remainder at each step.","Stop when the remainder becomes zero.","The last non-zero remainder is the answer."],revision:"Euclid's algorithm is an efficient repeated-division method for finding the GCD."}
]

topics:[

{name:"Properties and Tests of Parallelograms",explanation:"A quadrilateral is a parallelogram if both pairs of opposite sides are parallel. Certain other conditions can also establish that a quadrilateral is a parallelogram.",definitions:["Diagonal: A line segment joining opposite vertices.","Bisect: To divide into two equal parts.","Opposite Sides: Sides that do not share a vertex."],formulas:["In parallelogram ABCD: AB=CD and BC=AD.","∠A=∠C and ∠B=∠D.","Diagonals bisect each other."],examples:["If the diagonals of a quadrilateral bisect each other, the quadrilateral is a parallelogram."],important:["One pair of opposite sides being equal is not enough by itself.","Check the exact condition given in a theorem."],revision:"Opposite sides, opposite angles and diagonals have special relationships in a parallelogram."},
{name:"Midpoint Theorem and Centroid",explanation:"The midpoint theorem relates the segment joining the midpoints of two sides of a triangle to its third side. The centroid is the point where the three medians of a triangle meet.",definitions:["Midpoint: A point dividing a line segment into two equal parts.","Median: A line segment joining a vertex to the midpoint of the opposite side.","Centroid: The common point of the three medians."],formulas:["Midpoint Theorem: The segment joining the midpoints of two sides of a triangle is parallel to the third side and half its length.","Centroid divides each median in the ratio 2:1 from the vertex."],examples:["If the third side of a triangle is 12 cm, the segment joining the midpoints of the other two sides is 6 cm."],important:["The midpoint theorem works for every triangle.","The centroid lies inside a triangle."],revision:"The midpoint theorem gives a parallel segment of half the third side; the centroid divides a median in the ratio 2:1."},
{name:"Varignon's Theorem and Tiling",explanation:"Joining the midpoints of consecutive sides of any quadrilateral forms a parallelogram. This result is known as Varignon's theorem. It also has applications in geometric tiling.",definitions:["Varignon's Theorem: The quadrilateral formed by joining the midpoints of the sides of any quadrilateral is a parallelogram.","Tiling: Covering a surface with shapes without gaps or overlaps."],formulas:[],examples:["Mark the midpoints of all four sides of a quadrilateral and join them consecutively to form a parallelogram."],important:["Use midpoint properties to justify the result.","A valid tiling covers the surface without gaps or overlaps."],revision:"Varignon's theorem connects quadrilaterals, midpoints and parallelograms."}
]

summary:"This chapter studies linear equations in two variables, their graphical representation, slope, intercepts and pairs of linear equations. It explains how to solve and interpret systems of equations.",
topics:[
{name:"Linear Equations in Two Variables",explanation:"A linear equation in two variables is an equation in which the highest power of each variable is one. Its solutions are ordered pairs that satisfy the equation.",definitions:["Linear Equation: An equation of degree one in its variables.","Ordered Pair: A pair (x,y) representing values of two variables.","Solution: A pair of values satisfying the equation."],formulas:["Standard form: ax+by+c=0, where a and b are not both zero."],examples:["For x+y=5, (2,3) is a solution because 2+3=5."],important:["A linear equation in two variables generally has infinitely many solutions.","Each solution can be represented as a point on a graph."],revision:"A solution of a linear equation in two variables is an ordered pair that satisfies the equation."},
{name:"Graph, Slope and Intercepts",explanation:"The graph of a linear equation in two variables is a straight line. The slope measures its steepness, while intercepts show where the line meets the coordinate axes.",definitions:["Slope: The measure of the steepness of a line.","X-intercept: The point where a line crosses the X-axis.","Y-intercept: The point where a line crosses the Y-axis."],formulas:["Slope m=(y₂−y₁)/(x₂−x₁), when x₂≠x₁.","Slope-intercept form: y=mx+c."],examples:["For y=2x+1, the slope is 2 and the y-intercept is 1."],important:["A horizontal line has slope 0.","A vertical line has undefined slope.","Use at least two points to draw a straight line."],revision:"A linear equation represents a straight line, and its slope measures its steepness."},
{name:"Pair of Linear Equations",explanation:"A pair of linear equations represents two lines in the same coordinate plane. Their common solution, if it exists, is the point where the two lines intersect.",definitions:["Consistent Pair: A pair having at least one solution.","Inconsistent Pair: A pair having no solution.","Dependent Pair: A pair having infinitely many solutions."],formulas:["For a₁x+b₁y+c₁=0 and a₂x+b₂y+c₂=0:","Unique solution if a₁/a₂ ≠ b₁/b₂.","No solution if a₁/a₂ = b₁/b₂ ≠ c₁/c₂.","Infinitely many solutions if a₁/a₂ = b₁/b₂ = c₁/c₂."],examples:["x+y=5 and x−y=1 have solution x=3, y=2."],important:["Intersecting lines have one solution.","Parallel distinct lines have no solution.","Coincident lines have infinitely many solutions."],revision:"The number of solutions depends on how the two lines are positioned."},
{name:"Methods of Solving Equations",explanation:"A pair of linear equations can be solved using graphical, substitution and elimination methods. Each method aims to find values satisfying both equations.",definitions:["Substitution Method: Replacing one variable using an expression from another equation.","Elimination Method: Removing one variable by adding or subtracting equations.","Graphical Method: Finding the intersection of two lines."],formulas:[],examples:["x+y=5 and x−y=1. Adding gives 2x=6, so x=3. Substituting gives y=2."],important:["Check the final values in both equations.","Use elimination when coefficients can be made equal easily.","Use substitution when one variable is already isolated."],revision:"Solve both equations together and verify the ordered pair in both."}
]
},

"CBSE|9|Mathematics|Math of Space: Surface Area and Volume": {
summary:"This chapter explores three-dimensional solids such as cuboids, cylinders, cones, pyramids and spheres. It explains how to calculate their surface areas and volumes.",
topics:[
{name:"Cuboids and Cubes",explanation:"A cuboid is a three-dimensional solid with six rectangular faces. A cube is a special cuboid in which all edges are equal.",definitions:["Cuboid: A solid with six rectangular faces.","Cube: A solid with six equal square faces.","Total Surface Area: The sum of the areas of all outer faces.","Volume: The space occupied by a solid."],formulas:["Cuboid TSA = 2(lb+bh+hl).","Cuboid Volume = lbh.","Cube TSA = 6a².","Cube Volume = a³."],examples:["For a cube of side 3 cm, volume = 3³ = 27 cm³."],important:["Use square units for surface area.","Use cubic units for volume."],revision:"Cuboid and cube formulas are based on their length, breadth and height."},
{name:"Cylinder",explanation:"A cylinder has two equal circular bases joined by a curved surface. Its dimensions are radius and height.",definitions:["Cylinder: A solid with two parallel circular bases.","Curved Surface Area: The area of the curved outer surface."],formulas:["CSA = 2πrh.","TSA = 2πr(h+r).","Volume = πr²h."],examples:["For r=3 cm and h=5 cm, volume = π×9×5 = 45π cm³."],important:["Use the radius, not the diameter, in the formulas.","Check whether the question asks for curved or total surface area."],revision:"A cylinder's volume is the area of its circular base multiplied by its height."},
{name:"Cone and Pyramid",explanation:"A cone has a circular base and a curved surface that meets at a vertex. A pyramid has a polygonal base and triangular side faces meeting at an apex.",definitions:["Cone: A solid with a circular base and one vertex.","Slant Height: The length along the sloping surface of a cone.","Pyramid: A solid with a polygonal base and triangular faces.","Apex: The top vertex of a cone or pyramid."],formulas:["Cone slant height l = √(r²+h²).","Cone CSA = πrl.","Cone TSA = πr(l+r).","Cone Volume = 1/3 πr²h.","Pyramid Volume = 1/3 × Base Area × Height."],examples:["For a cone with r=3 cm and h=4 cm, slant height = √(9+16)=5 cm."],important:["Do not confuse vertical height with slant height.","Use the perpendicular height in volume formulas."],revision:"Cone and pyramid volumes are one-third of the corresponding base area multiplied by height."},
{name:"Sphere and Hemisphere",explanation:"A sphere is a perfectly round three-dimensional solid. A hemisphere is half of a sphere.",definitions:["Sphere: A solid whose surface points are all at the same distance from its centre.","Hemisphere: Half of a sphere."],formulas:["Sphere Surface Area = 4πr².","Sphere Volume = 4/3 πr³.","Hemisphere CSA = 2πr².","Hemisphere TSA = 3πr².","Hemisphere Volume = 2/3 πr³."],examples:["For a sphere of radius 3 cm, volume = 4/3×π×27 = 36π cm³."],important:["A hemisphere has one circular flat face.","Total surface area includes the flat circular base."],revision:"Remember the difference between curved surface area and total surface area."},
{name:"Units and Applications",explanation:"Surface area and volume are used in real-life problems involving containers, packaging, construction and storage. Correct units and dimensions are essential.",definitions:["Linear Unit: A unit of length such as cm or m.","Square Unit: A unit of area such as cm² or m².","Cubic Unit: A unit of volume such as cm³ or m³."],formulas:["1 m = 100 cm.","1 m² = 10,000 cm².","1 m³ = 1,000,000 cm³.","1 litre = 1000 cm³."],examples:["A container with volume 2000 cm³ has capacity 2 litres."],important:["Convert all measurements into compatible units.","Write the correct unit in the final answer."],revision:"Surface area measures the outer covering, while volume measures the space occupied."}
]
}

"CBSE|9|Science|Exploration: Entering the World of Secondary Science": {
summary: "Introduction to scientific thinking, observation, experimentation and evidence-based explanations.",
topics: [
{name:"Scientific Method", explanation:"Science begins with observations and questions. A hypothesis is proposed and tested through a fair investigation. Results are analysed before drawing conclusions.", definitions:["Observation: Information collected using senses or instruments.","Hypothesis: A testable possible explanation.","Experiment: A planned investigation to test an idea.","Variable: A factor that can change in an experiment."], formulas:[], examples:["Observing that a plant near sunlight grows differently leads to a testable question about light and growth."], important:["Change one independent variable at a time in a fair test.","Record measurements carefully.","A conclusion must be supported by evidence."], revision:"Observe → Question → Hypothesis → Experiment → Results → Conclusion."},
{name:"Science and Society", explanation:"Scientific knowledge develops through evidence, discussion and repeated testing. Science helps solve problems in health, agriculture, communication and environmental protection.", definitions:["Scientific evidence: Information obtained through systematic investigation.","Inference: A conclusion drawn from observations."], formulas:[], examples:["Weather forecasting uses observations, instruments and scientific models."], important:["Scientific ideas can be improved when new evidence appears."], revision:"Science is a systematic, evidence-based way of understanding the world."}
]
},

"CBSE|9|Science|Cell: The Building Block of Life": {
summary:"Cells are the basic structural and functional units of living organisms. Their organelles perform specialised functions.",
topics: [
{name:"Cell Theory and Cell Types", explanation:"All living organisms are made of cells. New cells arise from pre-existing cells. Prokaryotic cells lack a true nucleus, while eukaryotic cells have a membrane-bound nucleus.", definitions:["Cell: Basic structural and functional unit of life.","Prokaryote: Organism whose cell lacks a membrane-bound nucleus.","Eukaryote: Organism whose cells contain a membrane-bound nucleus."], formulas:[], examples:["Bacteria are prokaryotic; plant and animal cells are eukaryotic."], important:["Cells may be unicellular or multicellular.","Cell size and shape relate to function."], revision:"Cell theory explains the common cellular basis of life."},
{name:"Cell Organelles", explanation:"The plasma membrane regulates movement of substances. The nucleus stores genetic information. Mitochondria release usable energy. Ribosomes make proteins. Endoplasmic reticulum helps in synthesis and transport. Golgi apparatus modifies and packages materials.", definitions:["Organelle: A specialised structure inside a cell.","Nucleus: Control centre containing genetic material.","Mitochondrion: Organelle involved in cellular respiration.","Ribosome: Site of protein synthesis."], formulas:[], examples:["Muscle cells contain many mitochondria because they require energy."], important:["Plant cells usually have a cell wall, chloroplasts and a large central vacuole.","Animal cells do not have a cell wall or chloroplasts."], revision:"Nucleus controls; mitochondria release energy; ribosomes make proteins; Golgi packages."},
{name:"Plant and Animal Cells", explanation:"Plant cells generally have a cellulose cell wall, chloroplasts and a large vacuole. Animal cells usually have smaller vacuoles and lack cell walls and chloroplasts.", definitions:["Cell wall: Rigid outer layer providing support.","Chloroplast: Plastid containing chlorophyll for photosynthesis.","Vacuole: Membrane-bound storage compartment."], formulas:[], examples:["Leaf cells contain chloroplasts; cheek cells do not."], important:["Both plant and animal cells have a plasma membrane, cytoplasm, nucleus and mitochondria."], revision:"Compare cell wall, chloroplasts and vacuoles when identifying plant and animal cells."}
]
},

"CBSE|9|Science|Tissues in Action": {
summary:"A tissue is a group of similar cells working together. Plant and animal tissues perform specialised functions.",
topics: [
{name:"Plant Tissues", explanation:"Meristematic tissues divide actively and help plants grow. Permanent tissues perform functions such as storage, support, protection and transport.", definitions:["Meristem: Region of actively dividing plant cells.","Parenchyma: Living tissue commonly involved in storage.","Collenchyma: Living tissue providing flexible support.","Sclerenchyma: Thick-walled tissue providing strength.","Xylem: Tissue transporting water and minerals.","Phloem: Tissue transporting food."], formulas:[], examples:["Xylem carries water from roots towards leaves; phloem transports sugars."], important:["Apical meristems increase length.","Lateral meristems increase thickness."], revision:"Meristematic tissue grows; permanent tissue performs specialised functions."},
{name:"Animal Tissues", explanation:"Animal tissues include epithelial, connective, muscular and nervous tissues. Each is adapted to a particular role.", definitions:["Epithelial tissue: Covers body surfaces and lines organs.","Connective tissue: Supports, binds or transports materials.","Muscular tissue: Contracts to produce movement.","Nervous tissue: Transmits electrical signals."], formulas:[], examples:["Blood is connective tissue; neurons are specialised nerve cells."], important:["Muscles may be skeletal, smooth or cardiac.","Cartilage and bone provide support."], revision:"Epithelial—covering; connective—support; muscular—movement; nervous—communication."}
]
},

"CBSE|9|Science|Describing Motion Around Us": {
summary:"Motion describes a change in position with time. It can be represented using distance, displacement, speed, velocity and acceleration.",
topics: [
{name:"Distance and Displacement", explanation:"Distance is the total path travelled. Displacement is the shortest directed change from initial to final position.", definitions:["Distance: Total length of the actual path.","Displacement: Directed change in position."], formulas:["Displacement = Final position − Initial position"], examples:["Walking 3 m east and 3 m west gives 6 m distance but zero displacement."], important:["Distance is scalar; displacement is vector.","Magnitude of displacement cannot exceed distance."], revision:"Distance measures path; displacement measures net change in position."},
{name:"Speed and Velocity", explanation:"Speed tells how fast an object moves. Velocity includes both speed and direction.", definitions:["Average speed: Total distance divided by total time.","Average velocity: Total displacement divided by total time."], formulas:["Average speed = Total distance / Total time","Average velocity = Displacement / Total time"], examples:["A car travels 100 km in 2 hours. Average speed = 50 km/h."], important:["SI unit of speed and velocity is m/s.","Uniform motion covers equal distances in equal time intervals."], revision:"Speed has magnitude; velocity has magnitude and direction."},
{name:"Acceleration and Motion Graphs", explanation:"Acceleration is the rate of change of velocity. A distance-time graph shows how distance changes with time; a velocity-time graph helps determine acceleration and displacement.", definitions:["Acceleration: Rate of change of velocity.","Uniform acceleration: Equal changes in velocity in equal time intervals."], formulas:["a = (v − u) / t","For uniform acceleration: v = u + at","s = ut + 1/2 at²","v² = u² + 2as"], examples:["If velocity changes from 5 m/s to 15 m/s in 5 s, acceleration = 2 m/s²."], important:["Slope of a distance-time graph gives speed.","Slope of a velocity-time graph gives acceleration.","Area under a velocity-time graph gives displacement."], revision:"Use motion equations only when acceleration is uniform."}
]
},

"CBSE|9|Science|Exploring Mixtures and Their Separation": {
summary:"Matter may be pure or mixed. Mixtures can be separated using physical methods based on differences in their properties.",
topics: [
{name:"Pure Substances and Mixtures", explanation:"A pure substance has a fixed composition and characteristic properties. A mixture contains two or more substances physically combined in variable proportions.", definitions:["Element: Pure substance made of one kind of atom.","Compound: Substance formed when elements chemically combine in fixed proportions.","Mixture: Physical combination of substances."], formulas:[], examples:["Oxygen is an element; water is a compound; air is a mixture."], important:["Mixture components retain many of their individual properties.","Mixtures may be homogeneous or heterogeneous."], revision:"Pure substances have fixed composition; mixtures have variable composition."},
{name:"Solutions, Suspensions and Colloids", explanation:"A solution is homogeneous. A suspension has larger particles that may settle. A colloid has intermediate-sized particles that remain dispersed and scatter light.", definitions:["Solute: Substance dissolved.","Solvent: Substance that dissolves the solute.","Solution: Homogeneous mixture.","Tyndall effect: Scattering of light by colloidal particles."], formulas:["Mass percentage = (Mass of solute / Mass of solution) × 100"], examples:["Salt water is a solution; muddy water is a suspension; milk is a colloid."], important:["Suspensions can settle on standing.","Colloids show the Tyndall effect."], revision:"Solution—homogeneous; suspension—settles; colloid—scatters light."},
{name:"Separation Techniques", explanation:"Separation methods use differences in particle size, solubility, density, boiling point or magnetic properties.", definitions:["Filtration: Separating insoluble solids from liquids.","Evaporation: Removing a solvent as vapour.","Distillation: Separation using vaporisation and condensation.","Chromatography: Separation based on different movement through a medium."], formulas:[], examples:["Filtration separates sand from water; evaporation recovers salt from salt solution."], important:["Separating funnel can separate immiscible liquids.","Centrifugation separates components using rapid spinning.","Crystallisation obtains pure crystals from a solution."], revision:"Choose a method according to the property that differs between components."}
]
},

"CBSE|9|Science|How Forces Affect Motion": {
summary:"Force is an interaction that can change motion or shape. Newton's laws explain the relationship between force, mass and motion.",
topics: [
{name:"Force and Inertia", explanation:"A force is a push or pull. Inertia is the tendency of an object to resist changes in its state of rest or uniform motion.", definitions:["Force: An interaction that can change motion or shape.","Inertia: Resistance to change in state of motion.","Balanced forces: Forces whose resultant is zero.","Unbalanced forces: Forces whose resultant is non-zero."], formulas:["Resultant force = Vector sum of all forces"], examples:["A stationary book remains at rest when the forces on it are balanced."], important:["Greater mass means greater inertia."], revision:"A net force is needed to change velocity."},
{name:"Newton's Laws of Motion", explanation:"First law describes inertia. Second law relates net force to rate of change of momentum. Third law states that interacting bodies exert equal and opposite forces on each other.", definitions:["Momentum: Product of mass and velocity.","Action-reaction pair: Equal and opposite forces acting on different bodies."], formulas:["p = mv","F = ma (constant mass)","F = (Change in momentum) / Time"], examples:["A moving trolley is harder to stop when its momentum is greater."], important:["Action and reaction act on different objects, so they do not cancel each other on one object.","SI unit of force is newton (N)."], revision:"First law—inertia; second law—force and momentum change; third law—action and reaction."},
{name:"Conservation of Momentum", explanation:"In an isolated system, total momentum remains constant if no external net force acts on the system.", definitions:["Conservation of momentum: Total momentum before an interaction equals total momentum after it in an isolated system."], formulas:["m₁u₁ + m₂u₂ = m₁v₁ + m₂v₂"], examples:["Two skaters push away from each other and move in opposite directions."], important:["Momentum is a vector quantity.","Use consistent directions and signs in numerical problems."], revision:"Total momentum before = total momentum after, for an isolated system."}
]
},

"CBSE|9|Science|Work, Energy and Simple Machines": {
summary:"Work is done when a force causes displacement. Energy is the capacity to do work, and machines help change the magnitude or direction of force.",
topics: [
{name:"Work", explanation:"In physics, work is done when a force produces displacement. Work may be positive, negative or zero depending on the direction of force relative to displacement.", definitions:["Work: Product of force and displacement in the direction of force."], formulas:["W = F × s (when force and displacement are parallel)","W = Fs cos θ"], examples:["Pushing a box through a distance involves work; holding a stationary bag involves zero mechanical work."], important:["SI unit is joule (J).","Work is zero when displacement is zero."], revision:"Work requires force and displacement."},
{name:"Energy and Power", explanation:"Kinetic energy is energy of motion; potential energy is stored due to position or configuration. Power measures how quickly work is done.", definitions:["Kinetic energy: Energy due to motion.","Potential energy: Energy due to position or configuration.","Power: Rate of doing work."], formulas:["K.E. = 1/2 mv²","Gravitational P.E. = mgh","Power = Work / Time"], examples:["A moving bicycle has kinetic energy; a raised object has gravitational potential energy."], important:["Energy is measured in joules.","Power is measured in watts.","Energy can change from one form to another."], revision:"K.E.—motion; P.E.—position; power—work per unit time."},
{name:"Simple Machines", explanation:"Simple machines make tasks easier by changing the size or direction of an applied force. Common examples include levers, pulleys, inclined planes, wheels and axles.", definitions:["Machine: Device that helps perform work.","Mechanical advantage: Ratio of load to effort.","Efficiency: Ratio of useful output work to input work."], formulas:["Mechanical Advantage = Load / Effort","Efficiency = (Output work / Input work) × 100%"], examples:["A ramp is an inclined plane; a seesaw is a lever."], important:["Real machines lose some energy, often due to friction.","A machine does not create energy."], revision:"Machines change how force is applied; they do not create energy."}
]
},

"CBSE|9|Science|Journey Inside the Atom": {
summary:"Atoms contain subatomic particles. Atomic models explain the arrangement of electrons and the structure of the nucleus.",
topics: [
{name:"Subatomic Particles", explanation:"Atoms contain positively charged protons, neutral neutrons and negatively charged electrons. Protons and neutrons are located in the nucleus; electrons occupy regions around it.", definitions:["Proton: Positively charged particle.","Neutron: Electrically neutral particle.","Electron: Negatively charged particle.","Nucleus: Dense central region of an atom."], formulas:["Mass number (A) = Protons + Neutrons","Atomic number (Z) = Number of protons"], examples:["A neutral atom with 8 protons has 8 electrons."], important:["Most atomic mass is concentrated in the nucleus.","A neutral atom has equal numbers of protons and electrons."], revision:"Protons + neutrons form the nucleus; electrons occupy the surrounding region."},
{name:"Atomic Models", explanation:"Thomson proposed a positively charged sphere with electrons embedded in it. Rutherford identified a small dense nucleus. Bohr proposed fixed energy levels for electrons.", definitions:["Atomic model: Scientific representation of atomic structure.","Energy level: Allowed energy state of an electron."], formulas:[], examples:["Bohr's model represents electrons in specific shells around the nucleus."], important:["Each model improved understanding using experimental evidence.","The nucleus is very small compared with the overall size of an atom."], revision:"Thomson → Rutherford → Bohr: successive models of the atom."},
{name:"Electronic Configuration", explanation:"Electrons occupy shells around the nucleus. For the first few elements, shells are filled according to the allowed capacity and the outermost shell is important for chemical behaviour.", definitions:["Electronic configuration: Arrangement of electrons in shells.","Valence electrons: Electrons in the outermost shell."], formulas:["Maximum electrons in shell = 2n²"], examples:["Oxygen (atomic number 8): electronic configuration 2,6."], important:["The first shell can hold up to 2 electrons.","The second shell can hold up to 8 electrons."], revision:"Atomic number gives electron count in a neutral atom; distribute electrons shell-wise."}
]
},

"CBSE|9|Science|Atomic Foundations of Matter": {
summary:"Atoms combine to form molecules and compounds. Chemical formulae represent composition, while chemical equations represent reactions.",
topics: [
{name:"Atoms, Molecules and Ions", explanation:"Atoms are the basic units of elements. Molecules contain atoms chemically bonded together. Ions are charged particles formed by gaining or losing electrons.", definitions:["Molecule: Two or more atoms chemically bonded.","Cation: Positively charged ion.","Anion: Negatively charged ion.","Valency: Combining capacity of an atom or ion."], formulas:[], examples:["O₂ is a molecule of an element; H₂O is a compound molecule; Na⁺ is a cation."], important:["Atoms are conserved in ordinary chemical reactions.","Ionic compounds contain positive and negative ions."], revision:"Atoms combine; molecules form; ions carry charge."},
{name:"Chemical Formulae", explanation:"A chemical formula uses element symbols and subscripts to show the types and numbers of atoms in a substance. Formulae of ionic compounds are written using charge balance.", definitions:["Chemical formula: Symbolic representation of a substance.","Molecular mass: Sum of atomic masses of atoms in a molecule.","Formula unit: Simplest whole-number ratio of ions in an ionic solid."], formulas:["Molecular mass = Sum of atomic masses of all atoms in a molecule"], examples:["H₂O contains two hydrogen atoms and one oxygen atom."], important:["Subscripts show atom counts.","The total positive and negative charges in a neutral ionic compound balance."], revision:"Read symbols and subscripts carefully; balance ionic charges when writing formulae."},
{name:"Chemical Reactions and Equations", explanation:"A chemical reaction converts reactants into products. A balanced equation has the same number of each type of atom on both sides.", definitions:["Reactant: Starting substance in a reaction.","Product: Substance formed in a reaction.","Balanced equation: Equation obeying conservation of atoms."], formulas:[], examples:["2H₂ + O₂ → 2H₂O"], important:["Never change chemical formula subscripts to balance an equation.","Change coefficients to balance atoms."], revision:"Write formulae first, then balance using coefficients."}
]
},

{name:"Chapter Summary", explanation:"The story describes a young girl who teaches her grandmother to read. The grandmother develops a strong desire to read independently and works hard to achieve her goal. The granddaughter supports her with patience and encouragement.", definitions:["Determination: Firmness of purpose.","Literacy: The ability to read and write.","Independence: The ability to do things without depending on others."], formulas:[], examples:["The grandmother's commitment to learning demonstrates that age is not a barrier to education."], important:["Education gives confidence and independence.","Family support can encourage lifelong learning.","Respect for learners is important at every age."], revision:"Central idea: It is never too late to learn. Determination and support make learning possible."},

{name:"Poetic Appreciation", explanation:"The poem uses descriptive language and patriotic imagery to create admiration for India.", definitions:["Imagery: Language that creates sensory pictures.","Tone: The poet's attitude towards the subject."], formulas:[], examples:["Descriptions of natural beauty help readers imagine the landscape."], important:["Identify images, tone and the poem's central message."], revision:"Look for patriotic imagery, descriptive words and expressions of pride."}

{name:"Poetic Appreciation", explanation:"The poem uses an appreciative tone to show the importance of work and service.", definitions:["Appreciative tone: A tone expressing recognition and gratitude."], formulas:[], examples:["The different occupations create a picture of a connected society."], important:["Notice the poem's positive attitude towards work."], revision:"Theme: dignity of labour, gratitude and social contribution."}

{name:"Distance and Section Formula",explanation:"Coordinates describe the position of a point on a plane. Formulas help calculate the distance between two points and the coordinates of a point dividing a line segment.",definitions:["Coordinates: An ordered pair (x,y) representing a point.","Abscissa: The x-coordinate.","Ordinate: The y-coordinate."],formulas:["Distance = √[(x₂-x₁)²+(y₂-y₁)²]","Section formula for AP: ((mx₂+nx₁)/(m+n), (my₂+ny₁)/(m+n))","Midpoint = ((x₁+x₂)/2, (y₁+y₂)/2)"],examples:["Distance between (0,0) and (3,4) = √(9+16) = 5.","Midpoint of (2,4) and (6,8) = (4,6)."],important:["Keep x and y coordinates in the correct order.","Use the section formula with the correct ratio.","Check signs carefully when subtracting negative coordinates."],revision:"Practise distance, midpoint and internal section formula questions."}

"CBSE|10|Mathematics|Circles":{

{name:"Circle, Sector and Segment",explanation:"A sector is the region enclosed by two radii and an arc. A segment is the region enclosed by a chord and its corresponding arc.",definitions:["Radius: Distance from the centre to the circle.","Circumference: Perimeter of a circle.","Sector: A part of a circle enclosed by two radii and an arc.","Segment: A region between a chord and an arc."],formulas:["Circumference = 2πr","Area = πr²","Arc length = (θ/360°) × 2πr","Sector area = (θ/360°) × πr²"],examples:["For r=7 cm, circumference = 2×22/7×7 = 44 cm.","For r=7 cm, area = 22/7×7×7 = 154 cm²."],important:["Use the same units throughout.","Check whether the question asks for area or perimeter.","For a semicircle, use half the circle's area."],revision:"Revise circumference, area, arc length and sector area."}

"CBSE|10|Science|Chemical Reactions and Equations":{
summary:"This chapter explains chemical changes, chemical equations, balancing equations and different types of chemical reactions.",

"CBSE|10|Science|Acids, Bases and Salts":{
summary:"This chapter covers the properties of acids and bases, indicators, pH, neutralisation and important salts.",
topics:[
{name:"Acids, Bases and Salts",explanation:"Acids produce H⁺ ions in aqueous solution, while bases produce OH⁻ ions. Indicators help identify acidic and basic solutions. Neutralisation produces salt and water.",definitions:["Acid: A substance that produces H⁺ ions in aqueous solution.","Base: A substance that produces OH⁻ ions in aqueous solution.","Indicator: A substance that changes colour in acidic or basic solutions.","Neutralisation: Reaction between an acid and a base."],formulas:["Acid + Base → Salt + Water","pH below 7: Acidic; pH 7: Neutral; pH above 7: Basic","HCl + NaOH → NaCl + H₂O"],examples:["Blue litmus turns red in an acidic solution.","Red litmus turns blue in a basic solution.","HCl reacts with NaOH to form sodium chloride and water."],important:["Learn the pH scale and common indicators.","Know the uses of baking soda, washing soda and bleaching powder.","Acids and bases show their properties in aqueous solution."],revision:"Revise indicators, pH, neutralisation and preparation and uses of salts."}

"CBSE|10|Science|Metals and Non-metals":{
summary:"This chapter compares physical and chemical properties of metals and non-metals and explains reactivity, ionic compounds and extraction of metals.",
topics:[
{name:"Properties and Reactivity",explanation:"Metals generally conduct heat and electricity and are malleable and ductile. Non-metals generally have different physical properties. Their chemical behaviour depends on electron transfer and reactivity.",definitions:["Malleability: Ability to be beaten into thin sheets.","Ductility: Ability to be drawn into wires.","Corrosion: Gradual damage of a metal due to its surroundings.","Ionic bond: Bond formed through transfer of electrons."],formulas:["2Mg + O₂ → 2MgO","Zn + CuSO₄ → ZnSO₄ + Cu","2Na + 2H₂O → 2NaOH + H₂"],examples:["Magnesium burns in oxygen to form magnesium oxide.","Zinc displaces copper from copper sulphate solution."],important:["Learn the reactivity series.","Metals generally lose electrons to form positive ions.","Ionic compounds usually have high melting and boiling points."],revision:"Revise physical properties, reactions, reactivity series, ionic compounds and corrosion."}
]},

"CBSE|10|Science|Carbon and its Compounds":{
summary:"This chapter studies carbon bonding, covalent compounds, hydrocarbons, functional groups, homologous series, ethanol, ethanoic acid and soaps.",
topics:[
{name:"Carbon Bonding and Compounds",explanation:"Carbon forms covalent bonds by sharing electrons. Its ability to form long chains and rings is called catenation. Carbon compounds are widely used as fuels, materials and in everyday products.",definitions:["Covalent bond: A bond formed by sharing electrons.","Catenation: Ability of an element to form bonds with its own atoms.","Hydrocarbon: Compound containing only carbon and hydrogen.","Homologous series: Family of compounds with the same functional group and a common general formula."],formulas:["Methane: CH₄","Ethane: C₂H₆","Ethene: C₂H₄","Ethyne: C₂H₂","Ethanol: C₂H₅OH","Ethanoic acid: CH₃COOH"],examples:["CH₄ + 2O₂ → CO₂ + 2H₂O","Ethanol is used in some industrial and laboratory applications.","Ethanoic acid is the main acid present in vinegar."],important:["Carbon has valency 4.","Know saturated and unsaturated compounds.","Learn addition and substitution reactions.","Understand micelle formation and cleansing action of soap."],revision:"Revise covalent bonding, hydrocarbon families, functional groups and soap action."}

"CBSE|10|Science|Life Processes":{
summary:"This chapter explains the essential processes that maintain life: nutrition, respiration, transportation and excretion.",
topics:[
{name:"Nutrition, Respiration, Transport and Excretion",explanation:"Living organisms need energy and materials for maintenance. Nutrition provides food, respiration releases energy, transport moves substances and excretion removes metabolic wastes.",definitions:["Autotrophic nutrition: Organisms prepare their own food.","Heterotrophic nutrition: Organisms obtain food from other organisms.","Respiration: Process of releasing energy from food.","Excretion: Removal of metabolic wastes."],formulas:["Photosynthesis: 6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂ (in the presence of light and chlorophyll)","Aerobic respiration: Glucose + Oxygen → Carbon dioxide + Water + Energy"],examples:["Green plants prepare food by photosynthesis.","The human heart pumps blood throughout the body.","Kidneys filter blood and help form urine."],important:["Learn the roles of stomata and chlorophyll.","Understand the human digestive, respiratory and circulatory systems.","Compare aerobic and anaerobic respiration.","Study transport in plants and excretion in humans."],revision:"Revise all four life processes with labelled diagrams."}
]},

"CBSE|10|Science|Control and Coordination":{

topics:[
{name:"Nervous and Hormonal Coordination",explanation:"The nervous system uses electrical impulses to transmit information quickly. Hormones are chemical messengers that regulate several body functions. Plants also respond to stimuli through growth movements.",definitions:["Neuron: Structural and functional unit of the nervous system.","Reflex action: A rapid, automatic response to a stimulus.","Hormone: Chemical messenger released by endocrine glands.","Tropism: Directional growth response of a plant to a stimulus."],formulas:["Stimulus → Receptor → Sensory neuron → CNS → Motor neuron → Effector"],examples:["Pulling a hand away from a hot object is a reflex action.","A shoot bends towards light due to phototropism.","Insulin helps regulate blood glucose."],important:["Learn the parts of a neuron.","Understand reflex arc and brain functions.","Compare nervous and hormonal coordination.","Study plant hormones and tropic movements."],revision:"Revise neuron diagrams, reflex arc, brain, endocrine glands and plant responses."}

"CBSE|10|Science|How do Organisms Reproduce?":{
summary:"This chapter explains reproduction, asexual reproduction, sexual reproduction in plants and humans, and reproductive health.",
topics:[
{name:"Modes of Reproduction",explanation:"Reproduction produces new individuals of the same species. Asexual reproduction involves one parent, while sexual reproduction generally involves the formation and fusion of gametes.",definitions:["Asexual reproduction: Reproduction involving a single parent without fusion of gametes.","Sexual reproduction: Reproduction involving fusion of male and female gametes.","Fertilisation: Fusion of male and female gametes.","Pollination: Transfer of pollen grains from anther to stigma."],formulas:[],examples:["Binary fission occurs in Amoeba.","Budding occurs in Hydra.","In flowering plants, fertilisation takes place after pollination and pollen tube growth."],important:["Learn binary fission, budding, fragmentation and vegetative propagation.","Understand the structure of a flower.","Study the basic reproductive systems of humans.","Reproductive health includes hygiene, awareness and responsible health education."],revision:"Revise asexual and sexual reproduction with diagrams and key terms."}

"CBSE|10|Science|Heredity":{
summary:"This chapter introduces heredity, inherited traits, Mendel's experiments and the basic principles of inheritance.",
topics:[
{name:"Inheritance of Traits",explanation:"Heredity is the transmission of traits from parents to offspring. Genes are units of inheritance, and variations can arise during reproduction.",definitions:["Heredity: Passing of traits from parents to offspring.","Gene: A segment of DNA that influences a trait.","Trait: A characteristic of an organism.","Variation: Differences among individuals of the same species."],formulas:["For a simple monohybrid cross: TT × tt → all Tt in F₁","Tt × Tt gives a genotypic ratio of 1:2:1 and a phenotypic ratio of 3:1, when T is completely dominant."],examples:["In pea plants, tallness can be dominant over dwarfness in a simple Mendelian example.","Offspring inherit genetic information from both parents."],important:["Understand dominant and recessive traits.","Learn Mendel's monohybrid cross.","Distinguish genotype and phenotype.","Follow the exact inheritance patterns given in a question."],revision:"Revise genes, traits, dominant and recessive alleles and monohybrid crosses."}

"CBSE|10|Science|Light: Reflection and Refraction":{
summary:"This chapter studies reflection and refraction of light, spherical mirrors, lenses, image formation and numerical problems.",
topics:[
{name:"Reflection and Refraction",explanation:"Reflection is the bouncing back of light from a surface. Refraction is the change in direction of light when it passes from one transparent medium to another.",definitions:["Principal axis: Straight line passing through the pole and centre of curvature of a spherical mirror.","Focal length: Distance between the pole and principal focus of a mirror or optical centre and principal focus of a lens.","Refractive index: Measure of how much light slows down in a medium."],formulas:["Mirror formula: 1/f = 1/v + 1/u","Magnification for mirror: m = -v/u","Lens formula: 1/f = 1/v - 1/u","Magnification for lens: m = v/u","Power of lens: P = 1/f (f in metres)"],examples:["A convex lens can converge parallel rays of light.","A concave mirror can form real or virtual images depending on object position."],important:["Follow the Cartesian sign convention.","Learn ray diagrams for mirrors and lenses.","Use correct units in numerical questions.","Power is measured in dioptres."],revision:"Revise laws of reflection, refraction, ray diagrams and numerical formulas."}

"CBSE|10|Science|The Human Eye and the Colourful World":{
summary:"This chapter explains the structure of the human eye, accommodation, common vision defects, refraction through a prism and atmospheric effects.",
topics:[
{name:"Vision and Optical Phenomena",explanation:"The human eye forms images on the retina. The eye lens changes its focal length to focus on objects at different distances. Atmospheric refraction and scattering explain several natural optical phenomena.",definitions:["Accommodation: Ability of the eye lens to adjust its focal length.","Myopia: Near-sightedness; distant objects appear blurred.","Hypermetropia: Far-sightedness; nearby objects appear blurred.","Dispersion: Splitting of white light into its constituent colours."],formulas:["Power of lens: P = 1/f (f in metres)"],examples:["Myopia is corrected using a concave lens.","Hypermetropia is corrected using a convex lens.","A prism can disperse white light into a spectrum."],important:["Learn the functions of cornea, iris, pupil, lens and retina.","Understand myopia and hypermetropia with diagrams.","Know atmospheric refraction and scattering.","Explain why the sky appears blue and the Sun appears reddish at sunrise or sunset."],revision:"Revise eye structure, vision defects, prism dispersion and scattering."}

function makeButton(label,fn){
 const b=document.createElement("button");
 b.textContent=label;
 b.className="option";
 b.onclick=fn;
 return b;
}

function resetPanels(){
 ["classPanel","subjectPanel","chapterPanel"].forEach(id=>{
  $(id).classList.add("hidden");
 });
 $("chapters").innerHTML="";
}

function selectBoard(board){
 selectedBoard=board;
 selectedClass="";
 selectedSubject="";
 resetPanels();

 $("classPanel").classList.remove("hidden");
 $("classes").innerHTML="";

 classOptions[board].forEach(c=>{
  $("classes").appendChild(
   makeButton("Class "+c,()=>selectClass(c))
  );
 });
}

function selectClass(c){
 selectedClass=c;
 selectedSubject="";
 $("subjectPanel").classList.remove("hidden");
 $("chapterPanel").classList.add("hidden");
 $("subjects").innerHTML="";

 subjectOptions[selectedBoard][c].forEach(subject=>{
  $("subjects").appendChild(
   makeButton(subject,()=>selectSubject(subject))
  );
 });
}

function selectSubject(subject){
 selectedSubject=subject;
 $("chapterPanel").classList.remove("hidden");
 $("chapterSearch").value="";

 const keys=Object.keys(lessonData).filter(key=>{
  const p=key.split("|");
  return p[0]===selectedBoard &&
         p[1]===String(selectedClass) &&
         p[2]===selectedSubject;
 });

 const chapterNames=keys.map(key=>key.split("|")[3]);
 renderChapters(chapterNames);
}

function renderChapters(list){
 $("chapters").innerHTML="";

 if(!list.length){
  $("chapters").innerHTML=
   '<div class="section">Chapter-wise verified study material has not yet been added for this subject. No invented chapter list or generic notes are being shown.</div>';
  return;
 }

 list.forEach(ch=>{
  const b=document.createElement("button");
  b.className="chapter";
  b.textContent="📘 "+ch;
  b.onclick=()=>openChapter(ch);
  $("chapters").appendChild(b);
 });
}

function filterChapters(){
 const q=$("chapterSearch").value.toLowerCase();
 const keys=Object.keys(lessonData).filter(key=>{
  const p=key.split("|");
  return p[0]===selectedBoard &&
         p[1]===String(selectedClass) &&
         p[2]===selectedSubject &&
         p[3].toLowerCase().includes(q);
 });
 renderChapters(keys.map(k=>k.split("|")[3]));
}

function escapeHTML(value){
 return String(value).replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#39;"
 })[c]);
}





function makeList(items){
  if(!items) return "<p>Not added yet.</p>";

  if(!Array.isArray(items)){
    items=[items];
  }

  if(!items.length) return "<p>Not applicable for this topic.</p>";

  return "<ul>"+items.map(item=>{
    if(Array.isArray(item)){
      return "<li>"+item.map(escapeHTML).join(": ")+"</li>";
    }
    return "<li>"+escapeHTML(item)+"</li>";
  }).join("")+"</ul>";
}

function makeDetails(items,heading){
  if(!items) return "";

  const list=Array.isArray(items)?items:[items];

  if(!list.length) return "";

  return "<h3>"+heading+"</h3>"+list.map(item=>{
    if(Array.isArray(item)){
      return "<p><b>"+escapeHTML(item[0] || "")+
      ":</b> "+escapeHTML(item[1] || "")+"</p>";
    }
    return "<p>"+escapeHTML(item)+"</p>";
  }).join("");
}

function openChapter(ch){

  selectedBoard,
  selectedClass,
  selectedSubject,
  ch
 ].join("|");

 const data=lessonData[key];

 if(!data){
  alert("Study material is not available for this chapter yet.");
  return;
 }

 $("home").classList.add("hidden");

 let html=`
  <div class="section">
   <h2>Chapter Summary</h2>
