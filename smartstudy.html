"CBSE|7|Mathematics|Large Numbers Around Us":{

topics:[
{name:"Large Numbers and Place Value",explanation:"Large numbers are used to express populations, distances and other big quantities. The place of a digit determines its value. In the Indian system, places include ones, thousands, lakhs and crores.",definitions:[["Place Value","The value a digit represents because of its position."],["Face Value","The digit itself, regardless of its position."]],formulas:["Expanded form = Sum of the place values of all digits."],examples:[["Write 45,67,890 in expanded form.","40,00,000 + 5,00,000 + 60,000 + 7,000 + 800 + 90."],["What is the place value of 6 in 45,67,890?","6 is in the ten-thousands place, so its value is 60,000."]],important:["Indian grouping: ones, thousands, lakhs, crores.","A zero can act as a placeholder."],revision:["Place value depends on position.","Face value is the digit itself."]},
{name:"Comparing and Estimating Large Numbers",explanation:"Compare numbers by first checking their number of digits. If they have the same number of digits, compare from the leftmost digit. Estimation gives an approximate value.",definitions:[["Estimation","Finding an approximate value instead of an exact value."]],formulas:["Estimated sum ≈ Sum of rounded numbers."],examples:[["Which is greater: 45,678 or 46,100?","46,100 is greater because its ten-thousands digit is 4 in both, but its thousands digit is 6 rather than 5."],["Estimate 48,500 + 21,300 to the nearest thousand.","49,000 + 21,000 = 70,000."]],important:["Compare from the highest place value.","Estimation is useful for checking calculations."],revision:["Count digits, then compare.","Round to a convenient place value."]}

{name:"Using Brackets and Simplification",explanation:"Brackets show which calculation must be performed first. Nested brackets are evaluated from the innermost pair outwards.",definitions:[["Simplification","Reducing an expression to its simplest numerical value."]],formulas:["a × (b + c) = a×b + a×c"],examples:[["Evaluate 30 − (4 + 6) × 2.","30 − 10 × 2 = 30 − 20 = 10."],["Evaluate 5 × (7 + 3).","5 × 10 = 50."]],important:["Read brackets carefully.","Do not simply calculate from left to right without checking priority."],revision:["Brackets first.","Then multiplication/division.","Then addition/subtraction."]}

"CBSE|7|Mathematics|A Peek Beyond the Point":{

{name:"Decimal Place Value",explanation:"A decimal number has a whole-number part and a fractional part separated by a decimal point. The first place after the decimal is tenths, followed by hundredths and thousandths.",definitions:[["Decimal","A number written using a decimal point to represent fractional parts."],["Tenths","One of ten equal parts of a whole."],["Hundredths","One of one hundred equal parts of a whole."]],formulas:["1/10 = 0.1","1/100 = 0.01","1/1000 = 0.001"],examples:[["Write 3/10 as a decimal.","3/10 = 0.3."],["What is the place value of 7 in 4.072?","7 is in the hundredths place, so its value is 0.07."]],important:["Zeros at the end of a decimal do not change its value.","Line up decimal points when adding or subtracting."],revision:["Tenths: first decimal place.","Hundredths: second decimal place.","Thousandths: third decimal place."]},
{name:"Comparing Decimals",explanation:"To compare decimals, compare their whole-number parts first. If these are equal, compare tenths, then hundredths and further places.",definitions:[["Equivalent Decimals","Decimals that represent the same value, such as 0.5 and 0.50."]],formulas:[],examples:[["Compare 2.45 and 2.5.","Write 2.5 as 2.50. Therefore 2.50 is greater than 2.45."],["Arrange 0.8, 0.08 and 0.18 in ascending order.","0.08, 0.18, 0.8."]],important:["Adding zeroes to the right of a decimal does not change its value.","Compare place values, not the number of digits."],revision:["Align decimal places.","Compare from left to right."]},

"CBSE|7|Mathematics|Expressions using Letter-Numbers":{

topics:[
{name:"Variables and Constants",explanation:"A variable is a letter used to represent a number that may change or is not yet known. A constant has a fixed value.",definitions:[["Variable","A symbol, usually a letter, representing a number."],["Constant","A fixed numerical value."],["Coefficient","The numerical factor multiplying a variable."]],formulas:["In 5x, coefficient = 5 and variable = x."],examples:[["Identify the coefficient of y in 7y + 3.","The coefficient is 7."],["If x = 4, find 3x.","3 × 4 = 12."]],important:["5x means 5 multiplied by x.","A letter does not always represent the same number in every problem."],revision:["Variable: changing or unknown value.","Constant: fixed value.","Coefficient: number multiplying a variable."]},
{name:"Forming Algebraic Expressions",explanation:"Words and situations can be translated into algebraic expressions. For example, five more than a number x is written as x + 5.",definitions:[["Algebraic Expression","An expression containing numbers, variables and operations."],["Like Terms","Terms having the same variable part with the same powers."]],formulas:["Twice x = 2x","Three less than x = x − 3","Sum of x and y = x + y"],examples:[["Write an expression for 4 more than twice x.","2x + 4."],["Simplify 3x + 2x.","5x."]],important:["2x and x² are not like terms.","Only like terms can be combined by addition or subtraction."],revision:["Translate words carefully.","Combine like terms."]},
{name:"Evaluating Expressions",explanation:"To evaluate an algebraic expression, substitute the given value of each variable and then perform the operations.",definitions:[["Substitution","Replacing a variable with its given numerical value."]],formulas:[],examples:[["Find 2x + 5 when x = 3.","2(3) + 5 = 6 + 5 = 11."],["Find a + 2b when a = 4 and b = 5.","4 + 2(5) = 14."]],important:["Use brackets when substituting negative numbers.","Follow the order of operations."],revision:["Substitute values.","Simplify carefully."]}
]

"CBSE|7|Mathematics|Parallel and Intersecting Lines":{
summary:"Lines may be parallel or intersecting. Angles formed by a transversal reveal important geometrical relationships.",
topics:[
{name:"Parallel and Intersecting Lines",explanation:"Parallel lines in the same plane never meet. Intersecting lines meet at one point. Perpendicular lines intersect at right angles.",definitions:[["Parallel Lines","Lines in the same plane that never intersect."],["Intersecting Lines","Lines that meet at a point."],["Perpendicular Lines","Lines that intersect at 90°."],["Transversal","A line that intersects two or more lines at distinct points."]],formulas:["Angle formed by perpendicular lines = 90°"],examples:[["What is the angle between perpendicular lines?","90°."],["Can two distinct parallel lines intersect?","No." ]],important:["Parallel lines remain the same distance apart.","A transversal creates pairs of angles."],revision:["Parallel: never meet.","Perpendicular: 90°.","Transversal: cuts lines."]},
{name:"Angles and Their Relationships",explanation:"When two lines intersect, vertically opposite angles are equal. Adjacent angles forming a straight line add up to 180°.",definitions:[["Vertically Opposite Angles","Opposite angles formed when two lines intersect."],["Linear Pair","Two adjacent angles whose non-common arms form a straight line."]],formulas:["Vertically opposite angles are equal.","Angles in a linear pair sum to 180°."],examples:[["One angle is 65°. Find its vertically opposite angle.","65°."],["One angle of a linear pair is 110°. Find the other.","180° − 110° = 70°."]],important:["Vertically opposite angles are equal.","A linear pair sums to 180°."],revision:["Opposite angles equal.","Linear pair = 180°."]},
{name:"Angles Made by a Transversal",explanation:"When a transversal cuts parallel lines, corresponding angles and alternate interior angles are equal. Co-interior angles on the same side of the transversal add up to 180°.",definitions:[["Corresponding Angles","Angles in matching positions at two intersections."],["Alternate Interior Angles","Interior angles on opposite sides of a transversal."],["Co-interior Angles","Interior angles on the same side of a transversal."]],formulas:["Corresponding angles are equal for parallel lines.","Alternate interior angles are equal.","Co-interior angles sum to 180°."],examples:[["A corresponding angle is 75°. Find the other.","75°."],["A co-interior angle is 115°. Find its partner.","180° − 115° = 65°."]],important:["These equalities apply when the lines are parallel.","Use the diagram to identify angle pairs."],revision:["Corresponding: equal.","Alternate interior: equal.","Co-interior: supplementary."]}

"CBSE|7|Mathematics|Number Play":{

{name:"Number Sequences",explanation:"A sequence is an ordered list of numbers following a rule. The rule may involve addition, subtraction, multiplication or a more complex relationship.",definitions:[["Sequence","An ordered list of numbers following a pattern."]],formulas:["For an arithmetic sequence: next term = previous term + common difference."],examples:[["Continue 4, 7, 10, 13.","Add 3 each time. Next term = 16."],["Continue 2, 4, 8, 16.","Multiply by 2. Next term = 32."]],important:["Find the relationship between consecutive terms.","Some sequences alternate between rules."],revision:["Identify the rule before extending a sequence."]},
{name:"Fibonacci and Virahanka Patterns",explanation:"In a Fibonacci-type sequence, each term after the first two is the sum of the previous two terms. Such patterns appear in mathematical explorations and nature.",definitions:[["Fibonacci Sequence","A sequence in which each term after the first two is the sum of the preceding two terms."]],formulas:["F(n) = F(n−1) + F(n−2)"],examples:[["Continue 1, 1, 2, 3, 5, 8.","5 + 8 = 13. The next term is 13." ]],important:["The starting terms determine the sequence.","The next term depends on the previous two."],revision:["Add the previous two terms."]}
]

{name:"Constructing Triangles",explanation:"A triangle can be constructed using given side lengths or angle information. A ruler and compass help transfer lengths and draw accurate figures.",definitions:[["Construction","An accurate geometrical drawing using instruments."],["Equilateral Triangle","A triangle with all three sides equal."],["Isosceles Triangle","A triangle with at least two equal sides."],["Scalene Triangle","A triangle with all sides of different lengths."]],formulas:["For three side lengths to form a triangle, the sum of any two sides must be greater than the third."],examples:[["Can sides 2 cm, 3 cm and 6 cm form a triangle?","No. 2 + 3 = 5, which is not greater than 6."],["Can 4 cm, 5 cm and 6 cm form a triangle?","Yes. Every pair has a sum greater than the remaining side."]],important:["Check the triangle inequality before construction.","Use a compass to transfer side lengths accurately."],revision:["Triangle inequality must hold.","Equilateral: three equal sides.","Isosceles: two equal sides."]},

"CBSE|7|Science|The Ever-Evolving World of Science":{
summary:"Science is a continuous process of observing, questioning, experimenting and discovering. Scientific knowledge grows when new evidence becomes available.",
topics:[
{name:"Science as a Way of Thinking",explanation:"Science is not merely a collection of facts. It is a systematic way of understanding the natural world. Scientists observe events, ask questions, develop explanations and test them using evidence.",definitions:[["Science","Systematic study of the natural world through observation and investigation."],["Observation","Carefully noticing and recording information."],["Evidence","Information or observations that support or challenge an explanation."],["Scientific Investigation","A planned process of answering questions through observations and experiments."]],formulas:[],examples:[["Why does a paper plane travel farther when thrown differently?","Its movement depends on factors such as the force of the throw, its shape and air resistance. These can be investigated through fair tests."]],important:["Ask questions about everyday events.","Use evidence instead of guesses.","Repeat investigations where possible.","Science changes when reliable new evidence appears."],revision:["Science = observation + questioning + investigation + evidence."]},
{name:"Experiments and Fair Tests",explanation:"An experiment is a planned investigation. A fair test changes one factor while keeping other relevant factors the same, so that the effect of the changed factor can be studied.",definitions:[["Variable","A factor that can change in an investigation."],["Independent Variable","The factor deliberately changed by the investigator."],["Dependent Variable","The factor measured or observed."],["Controlled Variable","A factor kept the same during a fair test."],["Conclusion","An explanation based on the results."]],formulas:[],examples:[["How can you test whether the shape of a paper plane affects its flight distance?","Make planes of different shapes using the same paper. Throw them with similar force and measure the distances. Repeat and compare results."]],important:["Change one main factor at a time.","Record measurements accurately.","Avoid changing the conclusion to fit expectations."],revision:["Question → Prediction → Fair test → Observation → Conclusion."]}

"CBSE|7|Science|Exploring Substances: Acidic, Basic, and Neutral":{
summary:"Substances can be classified as acidic, basic or neutral using indicators. Acids and bases can react with each other in neutralisation.",
topics:[
{name:"Acids and Bases",explanation:"Acids and bases are groups of substances with different chemical properties. Many sour-tasting substances are acidic, while some bitter or slippery substances are basic. Never taste laboratory chemicals to identify them.",definitions:[["Acid","A substance that produces hydrogen ions in aqueous solution."],["Base","A substance that neutralises an acid; many bases produce hydroxide ions in aqueous solution."],["Alkali","A base that dissolves in water."],["Neutral Substance","A substance that is neither acidic nor basic under the conditions tested."]],formulas:[],examples:[["Give two examples of acidic substances.","Lemon juice and vinegar."],["Give an example of a basic substance.","A solution of baking soda is mildly basic."]],important:["Never taste unknown substances.","Acids and bases can be identified using indicators.","Not all bases dissolve in water."],revision:["Acids and bases have different properties.","Use indicators, not taste, to identify them."]},
{name:"Indicators and Colour Changes",explanation:"Indicators are substances that show a colour change in acidic or basic solutions. Litmus, turmeric and China rose are examples of natural indicators. Universal indicator gives a range of colours related to pH.",definitions:[["Indicator","A substance that changes colour depending on whether a solution is acidic or basic."],["Litmus","A natural indicator obtained from lichens."],["Universal Indicator","A mixture of indicators that shows different colours over a range of pH values."],["pH","A scale used to describe how acidic or basic an aqueous solution is."]],formulas:["pH < 7: acidic","pH = 7: neutral at approximately 25°C","pH > 7: basic"],examples:[["What happens to blue litmus in an acidic solution?","It turns red."],["What happens to red litmus in a basic solution?","It turns blue."],["What is the approximate pH of a neutral solution at 25°C?","7."]],important:["Blue litmus detects acids.","Red litmus detects bases.","Indicator colours should be compared with a suitable colour chart."],revision:["Acid: blue litmus → red.","Base: red litmus → blue.","Neutral: pH approximately 7 at 25°C."]},
{name:"Neutralisation",explanation:"When an acid reacts with a base, they can neutralise each other to form salt and water. The reaction may release heat.",definitions:[["Neutralisation","A reaction between an acid and a base that produces salt and water."],["Salt","An ionic compound that may be formed during an acid-base reaction."]],formulas:["Acid + Base → Salt + Water","HCl + NaOH → NaCl + H₂O"],examples:[["What is formed when hydrochloric acid reacts with sodium hydroxide?","Sodium chloride and water." ]],important:["Neutralisation is a chemical reaction.","The final solution is not necessarily exactly neutral unless suitable amounts react.","Laboratory reactions require teacher supervision."],revision:["Acid + Base → Salt + Water."]},
{name:"Acids and Bases in Everyday Life",explanation:"Acids and bases are present in food, cleaning materials and many natural processes. Their properties have practical applications, but strong chemicals must be handled carefully.",definitions:[["Antacid","A substance used to neutralise excess stomach acid."],["Soil Treatment","The addition of suitable materials to adjust soil acidity or basicity."]],formulas:[],examples:[["Why may lime be added to acidic soil?","Lime is basic and can help reduce soil acidity."],["Why are antacids used?","They help neutralise excess stomach acid." ]],important:["Do not mix household cleaning chemicals.","Use chemicals only as directed by an adult or teacher.","Soil treatment depends on soil testing."],revision:["Acids and bases have many everyday uses.","Neutralisation is useful in agriculture and health."]}
]

topics:[
{name:"Electric Cells and Batteries",explanation:"An electric cell converts stored chemical energy into electrical energy. A battery consists of two or more cells connected together.",definitions:[["Electric Cell","A device that converts chemical energy into electrical energy."],["Battery","A combination of two or more electric cells."],["Terminals","The positive and negative ends of a cell."]],formulas:[],examples:[["What is the purpose of the terminals of a cell?","They provide connection points for an electrical circuit." ]],important:["Cells have positive and negative terminals.","A cell supplies energy to a circuit.","Never short-circuit a cell."],revision:["Cell supplies electrical energy.","Battery combines cells."]},
{name:"Electric Circuits",explanation:"An electric circuit is a closed conducting path through which current can flow. A gap or break makes the circuit open and interrupts the current.",definitions:[["Electric Circuit","A complete conducting path through which electric current can flow."],["Closed Circuit","A complete path that allows current to flow."],["Open Circuit","A broken or incomplete path that does not allow continuous current."],["Switch","A component used to open or close a circuit."]],formulas:["Current = Charge ÷ Time","I = Q/t"],examples:[["Why does a bulb not glow in an open circuit?","The conducting path is broken, so current cannot flow through the bulb." ]],important:["A complete path is needed for current.","A switch controls the circuit.","Connections should be secure."],revision:["Closed circuit: current can flow.","Open circuit: current stops."]},

{name:"Symbols and Circuit Diagrams",explanation:"Circuit diagrams use standard symbols to represent cells, bulbs, switches and connecting wires. They make circuits easier to communicate and understand.",definitions:[["Circuit Diagram","A drawing that represents an electrical circuit using standard symbols."]],formulas:[],examples:[["Why are circuit symbols useful?","They make circuit diagrams simple, clear and widely understandable." ]],important:["Use standard symbols.","Show all connections clearly.","A circuit diagram represents connections, not the physical appearance of components."],revision:["Circuit diagrams use standard symbols."]}
]

summary:"Materials are classified as metals and non-metals according to their physical and chemical properties.",
topics:[
{name:"Physical Properties of Metals",explanation:"Metals generally show lustre, malleability, ductility and good conductivity of heat and electricity. There are exceptions, so properties should not be treated as universal.",definitions:[["Lustre","The property of reflecting light and appearing shiny."],["Malleability","The ability of a material to be beaten into thin sheets."],["Ductility","The ability of a material to be drawn into wires."],["Conductivity","The ability of a material to allow heat or electricity to pass through it."]],formulas:[],examples:[["Why is copper used in electrical wires?","Copper is a good conductor of electricity and is ductile."],["Why is aluminium used for making some utensils?","It conducts heat and is relatively lightweight." ]],important:["Metals are generally lustrous.","Mercury is a liquid metal at room temperature.","Not every metal has the same properties."],revision:["Metals: generally lustrous, malleable, ductile and conductive."]},
{name:"Physical Properties of Non-metals",explanation:"Non-metals generally lack metallic lustre and are often poor conductors of heat and electricity. They may occur as solids, liquids or gases.",definitions:[["Non-metal","An element that generally does not show typical metallic properties."],["Brittleness","The tendency of a solid to break rather than bend when force is applied."]],formulas:[],examples:[["Why is sulphur classified as a non-metal?","It is a non-metallic element and does not show typical metallic properties."],["Name a liquid non-metal.","Bromine." ]],important:["Graphite is a non-metal that conducts electricity.","Bromine is liquid at room temperature."],revision:["Non-metals generally have poor conductivity, with exceptions."]},
{name:"Uses of Metals and Non-metals",explanation:"The properties of a material determine its uses. Metals are used in wires, structures and utensils. Non-metals are important in medicines, fertilisers and many industrial processes.",definitions:[["Alloy","A mixture containing a metal and one or more other elements, designed to improve properties."]],formulas:[],examples:[["Why is iron used in construction?","It is strong and can support heavy loads."],["Why is graphite used in pencil cores?","Its layers can rub off onto paper and leave a mark." ]],important:["Choose materials according to their properties.","Alloys can have improved strength or resistance to corrosion."],revision:["Material properties determine their uses."]},
{name:"Chemical Properties and Corrosion",explanation:"Some metals react with oxygen and moisture to form oxides. Rusting is the corrosion of iron in the presence of oxygen and water.",definitions:[["Corrosion","The gradual damage of a material due to chemical reactions with its surroundings."],["Rusting","The corrosion of iron in the presence of oxygen and water."],["Metal Oxide","A compound formed when a metal reacts with oxygen."]],formulas:["Iron + Oxygen + Water → Hydrated iron oxide (rust)"],examples:[["Why is painting used on iron gates?","Paint forms a protective barrier that reduces contact with oxygen and moisture." ]],important:["Rusting requires oxygen and water.","Painting, oiling and galvanising can help protect iron."],revision:["Corrosion damages metals.","Rusting affects iron."]}
]
},

"CBSE|7|Science|Changes Around Us: Physical and Chemical":{
summary:"Changes may be physical or chemical. Physical changes generally do not create new substances, while chemical changes produce new substances.",
topics:[
{name:"Physical Changes",explanation:"A physical change affects the shape, size or state of a substance without forming a new substance. Many physical changes are reversible, although not all are.",definitions:[["Physical Change","A change in which no new substance is formed."],["Reversible Change","A change that can be reversed to restore the original condition."],["Irreversible Change","A change that cannot easily be reversed to its original condition."]],formulas:[],examples:[["Is melting of ice a physical change?","Yes. Ice changes into water, but both are the same substance."],["Is tearing paper a physical change?","Yes. No new substance is formed, although the change is difficult to reverse." ]],important:["Physical changes may involve changes in state or shape.","Reversibility alone does not determine whether a change is physical."],revision:["Physical change: no new substance."]},
{name:"Chemical Changes",explanation:"A chemical change produces one or more new substances with properties different from the original materials. Signs may include gas formation, colour change, temperature change or formation of a precipitate.",definitions:[["Chemical Change","A change in which one or more new substances are formed."],["Reactants","Starting substances in a chemical reaction."],["Products","Substances formed in a chemical reaction."],["Precipitate","An insoluble solid formed in a solution during a reaction."]],formulas:["Reactants → Products"],examples:[["Is rusting a chemical change?","Yes. Iron reacts with oxygen and water to form rust."],["Is burning a candle only a physical change?","No. Wax melts physically, while wax vapour also undergoes chemical combustion." ]],important:["Chemical changes form new substances.","Many chemical changes are difficult to reverse.","A colour change alone does not always prove a chemical reaction."],revision:["Chemical change = formation of new substance."]},
{name:"Indicators of Chemical Reactions",explanation:"Chemical reactions may show observable signs such as gas formation, colour change, heat or light production, smell change or precipitate formation. These signs should be considered together with evidence.",definitions:[["Chemical Reaction","A process in which substances are transformed into new substances."],["Gas Evolution","Formation and release of a gas during a reaction."]],formulas:[],examples:[["Why does lime water turn milky when carbon dioxide is passed through it?","Carbon dioxide reacts with lime water to form insoluble calcium carbonate."],["What may bubbles during a reaction indicate?","They may indicate that a gas is being produced." ]],important:["Observe without directly smelling unknown chemicals.","Do not carry out heating experiments without a teacher."],revision:["Look for gas, colour, heat, light or precipitate."]},
{name:"Everyday Chemical Changes",explanation:"Cooking, digestion, rusting, fermentation and burning involve chemical changes. These processes are important in daily life and nature.",definitions:[["Fermentation","A process in which microorganisms convert substances such as sugars into other products."],["Combustion","A chemical reaction in which a substance reacts with oxygen and releases energy."]],formulas:["Word equation for respiration: Glucose + Oxygen → Carbon dioxide + Water + Energy"],examples:[["Why does dough rise when yeast is added?","Yeast produces carbon dioxide during fermentation, causing the dough to expand." ]],important:["Chemical changes occur in living organisms and the environment.","Some chemical changes release energy."],revision:["Cooking, digestion and rusting are examples of chemical changes."]}
]
},

"CBSE|7|Science|Adolescence: A Stage of Growth and Change":{
summary:"Adolescence is a stage of growth and development. Puberty brings physical, emotional and hormonal changes. Every individual develops at their own pace.",
topics:[
{name:"Stages of Human Life",explanation:"Human life passes through stages such as infancy, childhood, adolescence, adulthood and old age. Adolescence is a period of transition involving growth and development.",definitions:[["Adolescence","The period of life between childhood and adulthood, generally from about 10 to 19 years."],["Puberty","The stage during which the body develops reproductive maturity."],["Growth","An increase in size or development over time."]],formulas:[],examples:[["Are all adolescents the same age when puberty begins?","No. The timing varies from person to person." ]],important:["Development happens at different rates.","Individual differences are normal.","Adolescence involves more than physical growth."],revision:["Adolescence is a transition from childhood to adulthood."]},
{name:"Physical and Hormonal Changes",explanation:"Hormones are chemical messengers produced by endocrine glands. During puberty, hormonal changes influence growth, body development and maturation. Changes may include growth spurts, changes in voice, skin changes and development of secondary sexual characteristics.",definitions:[["Hormone","A chemical messenger produced by glands and carried to target organs."],["Endocrine Gland","A gland that releases hormones directly into the bloodstream."],["Secondary Sexual Characteristics","Physical features that develop during puberty and distinguish mature male and female bodies, apart from reproductive organs."]],formulas:[],examples:[["What is the role of hormones during puberty?","Hormones coordinate changes in growth, development and reproductive maturation." ]],important:["Changes occur at different times for different people.","No two people need to develop at exactly the same rate.","A balanced diet, sleep and physical activity support general health."],revision:["Hormones coordinate puberty-related changes."]},
{name:"Emotional and Social Development",explanation:"Adolescents may experience changing emotions, greater independence and new social responsibilities. Learning to communicate, manage feelings and seek reliable guidance supports well-being.",definitions:[["Emotional Development","Changes in understanding, expressing and managing feelings."],["Peer Group","A group of people of similar age or social position." ]],formulas:[],examples:[["Why is communication important during adolescence?","It helps people express concerns, understand others and seek support." ]],important:["Respect personal boundaries.","Avoid comparing individual development.","Seek guidance from trusted adults when confused or worried."],revision:["Emotional and social development are part of growing up."]},

"CBSE|8|Mathematics|A Square and A Cube": {
 summary:"Understand square numbers, cube numbers, their patterns and mathematical history.",
 topics:[
  {name:"Square Numbers",explanation:"A square number is obtained by multiplying a whole number by itself. Geometrically, it represents dots arranged in equal rows and columns.",definitions:[["Square number","A number of the form n × n or n²."]],formulas:["n² = n × n"],examples:[["Find 12²","12 × 12 = 144"]],important:["1, 4, 9, 16, 25, 36 are square numbers.","The square of an even number is even.","The square of an odd number is odd."],revision:["Square means multiply a number by itself."]},
  {name:"Cubic Numbers",explanation:"A cube number is obtained by multiplying a number by itself three times. It represents a cube with equal length, breadth and height.",definitions:[["Cube number","A number of the form n × n × n or n³."]],formulas:["n³ = n × n × n"],examples:[["Find 4³","4 × 4 × 4 = 64"]],important:["1, 8, 27, 64, 125 are cube numbers.","Cube numbers can be represented using unit cubes."],revision:["Cube means multiply the number three times."]}
 ]
},

"CBSE|8|Mathematics|Power Play": {
 summary:"Explore powers, exponents, exponential notation and powers of 10.",
 topics:[
  {name:"Understanding Powers",explanation:"Repeated multiplication can be written compactly using powers. In 2⁴, 2 is the base and 4 is the exponent.",definitions:[["Base","The number being multiplied repeatedly."],["Exponent","The number of times the base is used as a factor."]],formulas:["aᵐ × aⁿ = aᵐ⁺ⁿ","aᵐ ÷ aⁿ = aᵐ⁻ⁿ (a ≠ 0)","(aᵐ)ⁿ = aᵐⁿ"],examples:[["Write 3 × 3 × 3 × 3 as a power","3⁴ = 81"]],important:["An exponent tells the number of equal factors.","Do not confuse 2³ with 2 × 3."],revision:["Powers are a short way of writing repeated multiplication."]},
  {name:"Powers of 10",explanation:"Powers of 10 help represent very large and very small numbers. Each increase in a positive exponent multiplies the value by 10.",definitions:[["Exponential notation","Writing a number using a base and an exponent."]],formulas:["10¹ = 10","10² = 100","10³ = 1000","10⁰ = 1"],examples:[["Write 100000 as a power of 10","100000 = 10⁵"]],important:["Positive powers of 10 are useful for large numbers.","Negative powers represent fractions of 1."],revision:["Count the zeros in a power of 10 to identify its positive exponent."]}
 ]
},

"CBSE|8|Mathematics|A Story of Numbers": {
 summary:"Explore the development of number systems and how people represented and used numbers.",
 topics:[
  {name:"Early Number Systems",explanation:"Different civilisations developed ways to record quantities. Number systems used symbols, grouping and place-value ideas.",definitions:[["Numeral","A symbol used to represent a number."],["Number system","A set of symbols and rules used to represent numbers."]],formulas:["Place value = digit × value of its position"],examples:[["In 4,582, find the place value of 5","5 is in the hundreds place, so its place value is 500."]],important:["Our decimal system has ten digits: 0 to 9.","Place value depends on the position of a digit."],revision:["The decimal system is based on groups of ten."]},
  {name:"Comparing Number Systems",explanation:"Number systems may be positional or non-positional. In a positional system, the position of a symbol affects its value.",definitions:[["Positional system","A system in which a digit's position determines its value."],["Non-positional system","A system in which symbols do not use place value in the same way."]],formulas:["Expanded form: 352 = 300 + 50 + 2"],examples:[["Expand 7,406","7000 + 400 + 0 + 6"]],important:["Zero is important as a placeholder.","Place-value notation makes calculations easier."],revision:["Position and zero are key ideas in our number system."]}
 ]
},

"CBSE|8|Mathematics|Quadrilaterals": {
 summary:"Study four-sided polygons and the properties of rectangles, squares, parallelograms, rhombuses, kites and trapeziums.",
 topics:[
  {name:"Types of Quadrilaterals",explanation:"A quadrilateral is a closed polygon with four sides, four vertices and four angles. Different quadrilaterals have different side and angle properties.",definitions:[["Quadrilateral","A polygon with four sides."],["Parallelogram","A quadrilateral with both pairs of opposite sides parallel."],["Rhombus","A quadrilateral with all four sides equal."],["Trapezium","A quadrilateral with one pair of opposite sides parallel."],["Kite","A quadrilateral with two pairs of adjacent equal sides."]],formulas:["Sum of interior angles = 360°"],examples:[["Three angles are 80°, 90° and 100°. Find the fourth.","360° − (80° + 90° + 100°) = 90°"]],important:["Opposite sides of a parallelogram are equal and parallel.","All angles of a rectangle are 90°.","All sides of a square are equal."],revision:["Every quadrilateral has an angle sum of 360°."]},
  {name:"Angles and Properties",explanation:"Properties of parallel sides and equal sides help us identify quadrilaterals and calculate missing angles.",definitions:[["Adjacent angles","Angles next to each other sharing a side."],["Opposite angles","Angles across from each other in a quadrilateral."]],formulas:["Interior angle sum = 360°","Each angle of a rectangle = 90°"],examples:[["A parallelogram has one angle of 65°. Find its adjacent angle.","180° − 65° = 115°"]],important:["Adjacent angles of a parallelogram are supplementary.","Opposite angles of a parallelogram are equal."],revision:["Use parallel-line and angle-sum properties to solve problems."]}
 ]
},

"CBSE|8|Mathematics|Number Play": {
 summary:"Explore divisibility, factors, multiples, patterns and number puzzles.",
 topics:[
  {name:"Divisibility Rules",explanation:"Divisibility rules help us decide whether a number can be divided exactly by another number without performing long division.",definitions:[["Factor","A number that divides another number exactly."],["Multiple","A number obtained by multiplying a given number by an integer."]],formulas:["Divisible by 2: last digit is even.","Divisible by 3: sum of digits is divisible by 3.","Divisible by 5: last digit is 0 or 5.","Divisible by 10: last digit is 0."],examples:[["Is 246 divisible by 3?","2 + 4 + 6 = 12. Since 12 is divisible by 3, 246 is divisible by 3."]],important:["A number divisible by both 2 and 3 is divisible by 6.","Every number is a factor of itself."],revision:["Learn divisibility tests to check numbers quickly."]},
  {name:"Digits in Disguise",explanation:"Number puzzles use unknown digits and place value. We can form equations or use divisibility rules to discover missing digits.",definitions:[["Digit","One of the ten symbols from 0 to 9."],["Place value","The value a digit represents because of its position."]],formulas:["Two-digit number = 10a + b"],examples:[["Write a two-digit number with tens digit 4 and ones digit 7.","10 × 4 + 7 = 47"]],important:["A digit in the tens place has ten times its face value.","Check all possible digits against the given conditions."],revision:["Use place value and number properties to solve digit puzzles."]}
 ]
},

"CBSE|8|Mathematics|We Distribute, Yet Things Multiply": {
 summary:"Understand multiplication properties, distributive reasoning and ways to simplify calculations.",
 topics:[
  {name:"Distributive Property",explanation:"Multiplication can be distributed over addition or subtraction. This helps us break complicated calculations into simpler parts.",definitions:[["Distributive property","The rule that a(b + c) = ab + ac."]],formulas:["a(b + c) = ab + ac","a(b − c) = ab − ac"],examples:[["Calculate 8 × 23 using distribution","8 × (20 + 3) = 160 + 24 = 184"]],important:["Multiply each term inside the bracket.","The property works with subtraction too."],revision:["Distribute multiplication across every term inside brackets."]},
  {name:"Using Properties to Simplify",explanation:"Changing the grouping or order of factors can make multiplication easier. Choose convenient numbers while preserving the value.",definitions:[["Commutative property","Changing the order does not change the product."],["Associative property","Changing the grouping does not change the product."]],formulas:["a × b = b × a","(a × b) × c = a × (b × c)"],examples:[["Calculate 25 × 16","25 × (4 × 4) = 100 × 4 = 400"]],important:["Multiplication is commutative and associative.","Addition is also commutative and associative."],revision:["Rearrange and regroup factors to calculate efficiently."]}
 ]
},

"CBSE|8|Mathematics|Proportional Reasoning-1": {
 summary:"Understand ratios, equivalent ratios, rates and proportional relationships.",
 topics:[
  {name:"Ratios and Equivalent Ratios",explanation:"A ratio compares two quantities of the same kind. Equivalent ratios are obtained by multiplying or dividing both terms by the same non-zero number.",definitions:[["Ratio","A comparison of two quantities by division."],["Equivalent ratios","Ratios that represent the same comparison."]],formulas:["a:b = a/b","a:b = ka:kb (k ≠ 0)"],examples:[["Simplify 12:18","Divide both terms by 6. Answer = 2:3."]],important:["Compare quantities in the same units.","Order matters in a ratio."],revision:["Simplify a ratio by dividing both terms by their common factor."]},
  {name:"Proportion and Rates",explanation:"A proportion states that two ratios are equal. A rate compares quantities measured in different units, such as kilometres per hour.",definitions:[["Proportion","An equality between two ratios."],["Rate","A comparison of two quantities with different units."]],formulas:["a/b = c/d means ad = bc","Speed = Distance ÷ Time"],examples:[["A car travels 120 km in 3 hours. Find its average speed.","120 ÷ 3 = 40 km/h."]],important:["Equivalent ratios can be used to solve proportion problems.","Always include units in a rate."],revision:["Proportions compare equal ratios; rates compare different units."]}
 ]
},

"CBSE|8|Mathematics|Fractions in Disguise": {
 summary:"Explore fractions in different forms and understand how fractions represent parts, ratios and numbers.",
 topics:[
  {name:"Equivalent Fractions",explanation:"Equivalent fractions have different numerators and denominators but represent the same value. Multiply or divide both by the same non-zero number.",definitions:[["Numerator","The top number of a fraction."],["Denominator","The bottom number of a fraction."],["Equivalent fractions","Fractions with the same value."]],formulas:["a/b = (a × k)/(b × k)","a/b + c/b = (a + c)/b"],examples:[["Find an equivalent fraction of 3/4 with denominator 20.","Multiply numerator and denominator by 5: 15/20."]],important:["Denominator cannot be zero.","Use a common denominator to add unlike fractions."],revision:["Equivalent fractions represent the same amount."]},
  {name:"Operations with Fractions",explanation:"To add or subtract unlike fractions, first convert them to equivalent fractions with a common denominator. For multiplication, multiply numerators and denominators.",definitions:[["Reciprocal","The fraction obtained by interchanging numerator and denominator of a non-zero fraction."]],formulas:["a/b × c/d = ac/bd","a/b ÷ c/d = a/b × d/c","a/b − c/b = (a − c)/b"],examples:[["Calculate 1/2 + 1/3","LCM of 2 and 3 is 6. 3/6 + 2/6 = 5/6."],["Calculate 2/3 × 3/5","6/15 = 2/5."]],important:["Simplify the final answer when possible.","Division by a fraction means multiplication by its reciprocal."],revision:["Use common denominators for addition and subtraction."]}
 ]
},

"CBSE|8|Mathematics|The Baudhayana-Pythagoras Theorem": {
 summary:"Study the relationship between the sides of a right-angled triangle and its applications.",
 topics:[
  {name:"Right-Angled Triangles",explanation:"A right-angled triangle has one angle equal to 90°. The side opposite the right angle is the hypotenuse and is the longest side.",definitions:[["Hypotenuse","The side opposite the right angle."],["Legs","The two sides that form the right angle."]],formulas:["a² + b² = c²"],examples:[["Legs are 3 cm and 4 cm. Find the hypotenuse.","c² = 3² + 4² = 9 + 16 = 25, so c = 5 cm."]],important:["The theorem applies only to right-angled triangles.","The hypotenuse is always the longest side."],revision:["Square the two shorter sides, add them and find the square root."]},
  {name:"Applying the Theorem",explanation:"The theorem can help find an unknown side when the other two sides of a right-angled triangle are known.",definitions:[["Pythagorean triple","Three positive integers satisfying a² + b² = c²."]],formulas:["Unknown leg = √(c² − known leg²)"],examples:[["Hypotenuse is 13 cm and one leg is 5 cm. Find the other leg.","b² = 13² − 5² = 169 − 25 = 144, so b = 12 cm."]],important:["Check that the triangle is right-angled before applying the theorem.","3, 4, 5 and 5, 12, 13 are Pythagorean triples."],revision:["Use a² + b² = c² for right triangles."]}
 ]
},

"CBSE|8|Mathematics|Proportional Reasoning-2": {
 summary:"Extend proportional reasoning to solve practical problems involving direct and inverse relationships.",
 topics:[
  {name:"Direct Proportion",explanation:"Two quantities are directly proportional when increasing one quantity by a factor increases the other by the same factor, assuming the relationship remains constant.",definitions:[["Direct proportion","A relationship in which the ratio of corresponding quantities remains constant."]],formulas:["y/x = k","y₁/x₁ = y₂/x₂"],examples:[["If 2 notebooks cost ₹40, what do 5 cost?","One notebook costs ₹20. Five cost 5 × 20 = ₹100."]],important:["More quantity means more cost at a fixed unit price.","Keep units consistent."],revision:["In direct proportion, both quantities change in the same direction."]},
  {name:"Inverse Proportion",explanation:"Two quantities are inversely proportional when one increases while the other decreases so that their product stays constant.",definitions:[["Inverse proportion","A relationship in which the product of corresponding quantities remains constant."]],formulas:["x × y = k","x₁y₁ = x₂y₂"],examples:[["4 workers finish a task in 6 days. How long would 8 workers take at the same rate?","4 × 6 = 8 × d, so d = 3 days."]],important:["The total work and working rate are assumed constant.","Check whether the quantities move in opposite directions."],revision:["In inverse proportion, one increases as the other decreases."]}
 ]
},

"CBSE|8|Mathematics|Exploring Some Geometric Themes": {
 summary:"Investigate geometric patterns, constructions, symmetry and relationships between shapes.",
 topics:[
  {name:"Geometric Patterns",explanation:"Geometry uses points, lines, angles and shapes. Patterns can be identified by observing symmetry, repetition and relationships between figures.",definitions:[["Symmetry","A property in which parts of a figure match across a line or around a point."],["Line of symmetry","A line that divides a figure into two matching mirror halves."]],formulas:["Straight angle = 180°","Full turn = 360°"],examples:[["How many lines of symmetry does a square have?","A square has 4 lines of symmetry."]],important:["A figure may have more than one line of symmetry.","Not every shape has a line of symmetry."],revision:["Look for matching halves to identify line symmetry."]},
  {name:"Angles and Geometric Reasoning",explanation:"Geometric reasoning uses known angle facts and properties of lines and shapes to find unknown angles.",definitions:[["Complementary angles","Two angles whose sum is 90°."],["Supplementary angles","Two angles whose sum is 180°."]],formulas:["Complementary angle sum = 90°","Supplementary angle sum = 180°","Angles around a point = 360°"],examples:[["Find the complement of 35°","90° − 35° = 55°"]],important:["Vertically opposite angles are equal.","Angles on a straight line add to 180°."],revision:["Use angle sums and equal-angle properties to reason logically."]}
 ]
},

"CBSE|8|Mathematics|Tales by Dots and Lines": {
 summary:"Explore data, visual representations and patterns formed by points and lines.",
 topics:[
  {name:"Representing Data",explanation:"Data can be organised and represented using tables, dot plots and graphs. A suitable representation makes patterns easier to notice.",definitions:[["Data","A collection of facts or observations."],["Frequency","The number of times a value occurs."],["Dot plot","A graph that uses dots to show how often values occur."]],formulas:["Mean = Sum of observations ÷ Number of observations"],examples:[["Find the mean of 2, 4 and 6.","(2 + 4 + 6) ÷ 3 = 4."]],important:["Give graphs a clear title and labels.","Choose a suitable scale."],revision:["Organise data before interpreting it."]},
  {name:"Reading Patterns and Graphs",explanation:"A graph can show comparisons, changes and relationships. Read its axes, scale and labels carefully before drawing conclusions.",definitions:[["Axis","A reference line used to locate values on a graph."],["Scale","The fixed interval represented by divisions on an axis."]],formulas:["Range = Highest value − Lowest value"],examples:[["Find the range of 3, 7, 8, 12.","12 − 3 = 9."]],important:["Do not ignore the graph scale.","A graph should represent data accurately."],revision:["Read the labels and scale before interpreting a graph."]}
 ]
},

"CBSE|8|Mathematics|Algebra Play": {
 summary:"Use letters to represent unknown values and explore algebraic expressions, equations and patterns.",
 topics:[
  {name:"Algebraic Expressions",explanation:"Letters can represent numbers. An algebraic expression combines variables, numbers and operations.",definitions:[["Variable","A letter representing a number."],["Constant","A fixed numerical value."],["Coefficient","The numerical factor multiplying a variable."],["Like terms","Terms with the same variables raised to the same powers."]],formulas:["3x + 2x = 5x","a(b + c) = ab + ac"],examples:[["Simplify 4x + 3x − 2x","(4 + 3 − 2)x = 5x."]],important:["Only like terms can be combined.","The coefficient of x in 7x is 7."],revision:["Collect like terms to simplify expressions."]},
  {name:"Equations",explanation:"An equation states that two expressions are equal. Solve it by performing the same operation on both sides.",definitions:[["Equation","A mathematical statement containing an equality sign."],["Solution","A value that makes an equation true."]],formulas:["If x + a = b, then x = b − a","If ax = b, then x = b/a (a ≠ 0)"],examples:[["Solve x + 7 = 15","Subtract 7 from both sides: x = 8."],["Solve 3x = 21","Divide both sides by 3: x = 7."]],important:["Whatever operation is done on one side must also be done on the other.","Check a solution by substitution."],revision:["Keep both sides balanced while solving equations."]}
 ]
},

"CBSE|8|Mathematics|Area": {
 summary:"Understand area, compare regions and calculate areas of common two-dimensional shapes.",
 topics:[
  {name:"Area of Basic Shapes",explanation:"Area measures the surface enclosed by a two-dimensional shape. It is measured in square units.",definitions:[["Area","The amount of surface enclosed by a plane figure."],["Square unit","A unit used to measure area, such as cm² or m²."]],formulas:["Rectangle = length × breadth","Square = side × side","Triangle = 1/2 × base × height"],examples:[["Find the area of a rectangle 8 cm long and 5 cm wide.","8 × 5 = 40 cm²."]],important:["Always write square units.","Use perpendicular height in the triangle formula."],revision:["Area measures surface, not boundary length."]},

"CBSE|8|Science|Exploring the Investigative World of Science": {
 summary:"Learn how science investigates questions through observation, experiments, measurement and evidence.",
 topics:[
  {name:"Scientific Investigation",explanation:"Science begins with questions about the natural world. Scientists observe, ask questions, form possible explanations and test them using investigations.",definitions:[["Observation","Carefully noticing and recording something."],["Hypothesis","A possible explanation that can be tested."],["Experiment","A planned test used to investigate a question."]],formulas:[],examples:[["Why does a wet cloth dry faster in sunlight?","We can compare drying under sunlight and in shade while keeping other conditions similar."]],important:["Change one factor at a time in a fair test.","Record observations honestly.","Evidence helps us accept, reject or improve an explanation."],revision:["Observe → Question → Hypothesis → Experiment → Record → Conclusion."]},
  {name:"Fair Tests and Evidence",explanation:"A fair test keeps most conditions the same and changes the factor being investigated. Repeating measurements makes results more reliable.",definitions:[["Variable","A factor that can change in an investigation."],["Control","A condition kept the same during a fair test."],["Conclusion","An explanation based on observations and results."]],formulas:["Average = Sum of readings ÷ Number of readings"],examples:[["Readings are 4 cm, 5 cm and 6 cm. Find the average.","(4 + 5 + 6) ÷ 3 = 5 cm."]],important:["Use suitable measuring instruments.","Repeat readings when possible.","A conclusion must match the collected evidence."],revision:["A good investigation is planned, fair, repeatable and evidence-based."]}
 ]
},

"CBSE|8|Science|The Invisible Living World: Beyond Our Naked Eye": {
 summary:"Explore cells, microorganisms, levels of organisation and the useful and harmful roles of microbes.",
 topics:[
  {name:"Cells: Basic Units of Life",explanation:"All living organisms are made of cells. Some organisms consist of one cell, while others have many cells. Cells carry out essential life processes.",definitions:[["Cell","The basic structural and functional unit of life."],["Unicellular organism","An organism made of one cell."],["Multicellular organism","An organism made of many cells."]],formulas:[],examples:[["Name one unicellular organism.","Amoeba is a unicellular organism."]],important:["Cells vary in shape and size.","The cell membrane surrounds the cell.","The nucleus controls many cell activities in cells that have a nucleus."],revision:["The cell is the basic unit of life."]},
  {name:"Levels of Organisation",explanation:"In many multicellular organisms, similar cells work together to form tissues. Tissues form organs, and organs work together in organ systems.",definitions:[["Tissue","A group of similar cells performing a particular function."],["Organ","A structure made of different tissues working together."],["Organ system","A group of organs working together."]],formulas:[],examples:[["Give the levels of organisation in the human body.","Cell → Tissue → Organ → Organ system → Organism."]],important:["Different organs perform different functions.","Organ systems work together to keep the organism alive."],revision:["Cells form tissues, tissues form organs, and organs form systems."]},
  {name:"Microorganisms and Their Roles",explanation:"Microorganisms are tiny living organisms that generally cannot be seen clearly with the unaided eye. They include bacteria, fungi, protozoa and microscopic algae.",definitions:[["Microorganism","A living organism too small to be seen clearly without magnification."],["Fermentation","A process in which microorganisms convert substances such as sugars into other products."],["Decomposition","The breakdown of dead organic matter into simpler substances."]],formulas:[],examples:[["Which microorganism helps turn milk into curd?","Certain bacteria, such as Lactobacillus, help convert milk into curd."]],important:["Some microbes help make food.","Decomposers recycle nutrients in nature.","Some microorganisms cause diseases.","Yeast is used in baking and fermentation."],revision:["Microorganisms can be useful, harmful or essential to ecosystems."]}
 ]
},

"CBSE|8|Science|Health: The Ultimate Treasure": {
 summary:"Understand health as overall well-being and learn about hygiene, nutrition, physical activity and disease prevention.",
 topics:[
  {name:"Meaning of Health",explanation:"Health is more than simply not being ill. It includes physical, mental and social well-being. Healthy habits support growth and everyday activities.",definitions:[["Health","A state of physical, mental and social well-being."],["Hygiene","Practices that help maintain cleanliness and prevent disease."]],formulas:[],examples:[["Why is sleep important for health?","Adequate sleep supports rest, learning, mood and normal body functions."]],important:["Health includes mental and social well-being.","Clean surroundings help prevent infections.","Ask a trusted adult or health professional when unwell."],revision:["Health involves the whole person, not just the absence of disease."]},
  {name:"Healthy Habits and Disease Prevention",explanation:"Balanced food, safe drinking water, regular physical activity, adequate sleep and personal cleanliness help maintain health. Vaccination helps protect against certain infectious diseases.",definitions:[["Balanced diet","A diet containing different nutrients in suitable amounts."],["Communicable disease","A disease that can spread from one person or organism to another."],["Vaccination","A method of training the immune system to protect against specific infections."]],formulas:[],examples:[["How can handwashing reduce disease spread?","It removes many germs from hands and reduces their transfer to food, objects and people."]],important:["Wash hands before eating and after using the toilet.","Use safe drinking water.","Do not share personal hygiene items.","Follow recommended medical and vaccination advice."],revision:["Cleanliness, nutrition, activity, sleep and prevention support good health."]}
 ]
},

"CBSE|8|Science|Electricity: Magnetic and Heating Effects": {
 summary:"Study electric circuits, heating effect of current, magnetic effect and applications of electromagnets.",
 topics:[
  {name:"Electric Current and Heating Effect",explanation:"Electric current flows through a closed conducting circuit. When current passes through a resistance, electrical energy can be converted into heat.",definitions:[["Electric circuit","A complete conducting path through which current can flow."],["Conductor","A material that allows electric current to pass through it."],["Insulator","A material that does not allow current to pass through easily."]],formulas:["V = I × R","Electrical power P = V × I"],examples:[["A 6 V source is connected across a 3 Ω resistor. Find current.","I = V/R = 6/3 = 2 A."]],important:["A switch opens or closes a circuit.","Heating elements use the heating effect of current.","A fuse is a safety device that helps protect circuits from excessive current."],revision:["Current needs a closed circuit; resistance can produce heating."]},
  {name:"Magnetic Effect of Current",explanation:"An electric current produces a magnetic field around a conductor. A coil carrying current can behave like a magnet.",definitions:[["Magnetic field","The region around a magnet or current-carrying conductor where magnetic effects can be detected."],["Electromagnet","A temporary magnet produced using electric current, commonly with a coil and iron core."]],formulas:[],examples:[["Give one use of an electromagnet.","Electromagnets are used in electric bells and some lifting devices."]],important:["The magnetic effect depends on current in the conductor.","Switching off current usually removes the magnetism of a simple electromagnet.","Electricity can produce both heating and magnetic effects."],revision:["Current can produce heat and magnetic effects."]}
 ]
},

"CBSE|8|Science|Exploring Forces": {
 summary:"Understand pushes and pulls, balanced and unbalanced forces, contact and non-contact forces, and their effects.",
 topics:[
  {name:"What Is Force?",explanation:"A force is a push or pull caused by an interaction. It can change an object's speed, direction or shape.",definitions:[["Force","A push or pull acting on an object."],["Contact force","A force that acts when objects are in physical contact."],["Non-contact force","A force that acts without physical contact."]],formulas:["Force = Mass × Acceleration","F = m × a"],examples:[["A 2 kg object accelerates at 3 m/s². Find the force.","F = 2 × 3 = 6 N."]],important:["Force is measured in newtons (N).","Friction and muscular force are contact forces.","Gravitational and magnetic forces can act without direct contact."],revision:["Force can change motion or shape."]},
  {name:"Balanced and Unbalanced Forces",explanation:"When forces on an object balance, the net force is zero. Unbalanced forces produce a non-zero net force and can change the object's motion.",definitions:[["Balanced forces","Forces whose resultant is zero."],["Unbalanced forces","Forces whose resultant is not zero."],["Resultant force","The single force that has the same effect as all forces acting together."]],formulas:["Net force in same direction = F₁ + F₂","Net force in opposite directions = Larger force − Smaller force"],examples:[["Two opposite forces of 10 N and 6 N act on an object. Find the resultant.","10 − 6 = 4 N in the direction of the 10 N force."]],important:["Balanced forces do not change an object's state of motion.","Unbalanced forces can change speed or direction."],revision:["The net force determines whether forces are balanced."]}
 ]
},

"CBSE|8|Science|Pressure, Winds, Storms, and Cyclones": {
 summary:"Understand pressure in fluids, atmospheric pressure, wind formation and the science of storms and cyclones.",
 topics:[
  {name:"Pressure",explanation:"Pressure is the force acting per unit area. The same force produces greater pressure when applied over a smaller area.",definitions:[["Pressure","Force acting per unit area."],["Atmospheric pressure","Pressure exerted by the air surrounding Earth."],["Fluid","A substance such as a liquid or gas that can flow."]],formulas:["Pressure = Force ÷ Area","P = F/A"],examples:[["A force of 20 N acts on an area of 4 m². Find pressure.","P = 20/4 = 5 Pa."]],important:["The SI unit of pressure is pascal (Pa).","Pressure in a liquid generally increases with depth.","Air exerts pressure in all directions."],revision:["Pressure depends on force and area."]},
  {name:"Winds and Weather Systems",explanation:"Unequal heating of Earth's surface creates differences in air temperature and pressure. Air generally moves from regions of higher pressure towards lower pressure, producing wind.",definitions:[["Wind","Moving air."],["Cyclone","A large rotating weather system around a low-pressure centre."],["Humidity","The amount of water vapour present in air."]],formulas:[],examples:[["Why does warm air rise?","Warm air generally expands and becomes less dense than the surrounding cooler air."]],important:["Weather systems involve temperature, pressure and moisture.","Cyclones can bring strong winds and heavy rainfall.","Follow official weather warnings and safety instructions."],revision:["Unequal heating creates pressure differences that influence winds and storms."]}
 ]
},

"CBSE|8|Science|Particulate Nature of Matter": {
 summary:"Explore matter as particles and understand particle arrangement, movement, diffusion and changes of state.",
 topics:[
  {name:"Matter and Its Particles",explanation:"Matter is made of tiny particles. These particles have spaces between them, are always moving and attract one another.",definitions:[["Matter","Anything that has mass and occupies space."],["Diffusion","The spreading and mixing of particles from one region into another."],["Compressibility","The ability of a substance to decrease in volume when pressure is applied."]],formulas:[],examples:[["Why does the smell of perfume spread through a room?","Perfume vapour particles move and mix with air particles by diffusion."]],important:["Particles are closely packed in solids.","Particles can move more freely in liquids and gases.","Gases are generally more compressible than solids and liquids."],revision:["Matter is particulate; its particles are constantly moving."]},
  {name:"States and Changes of Matter",explanation:"Matter commonly exists as solid, liquid or gas. Heating and cooling can change the arrangement and movement of particles, causing changes of state.",definitions:[["Melting","Change of solid into liquid."],["Freezing","Change of liquid into solid."],["Evaporation","Change of liquid into vapour from its surface."],["Condensation","Change of gas or vapour into liquid."]],formulas:[],examples:[["What happens when water vapour cools?","It may condense into liquid water."]],important:["Heating generally increases particle motion.","Evaporation can occur below the boiling point.","During a change of state, energy is absorbed or released."],revision:["Heating and cooling can change the state of matter."]}
 ]
},

"CBSE|8|Science|Nature of Matter: Elements, Compounds, and Mixtures": {
 summary:"Classify matter into elements, compounds and mixtures and learn how their properties differ.",
 topics:[
  {name:"Elements and Compounds",explanation:"An element contains only one kind of atom. A compound contains two or more elements chemically combined in a fixed proportion.",definitions:[["Element","A pure substance made of one kind of atom."],["Compound","A pure substance formed when elements chemically combine in a fixed ratio."],["Atom","The smallest unit of an element that takes part in chemical changes."],["Molecule","A group of two or more atoms chemically bonded together."]],formulas:["Water = H₂O","Carbon dioxide = CO₂","Oxygen molecule = O₂"],examples:[["Is water an element or compound?","Water is a compound because hydrogen and oxygen are chemically combined."]],important:["Elements cannot be broken into simpler substances by ordinary chemical methods.","Compounds have properties different from their constituent elements."],revision:["Elements contain one type of atom; compounds contain chemically combined elements."]},
  {name:"Mixtures",explanation:"A mixture contains two or more substances physically combined. Its components may be present in different proportions and can often be separated by physical methods.",definitions:[["Mixture","A physical combination of two or more substances."],["Homogeneous mixture","A mixture with uniform composition throughout."],["Heterogeneous mixture","A mixture with non-uniform composition."]],formulas:[],examples:[["Is salt water a mixture?","Yes. Salt and water are physically mixed, and salt can be recovered by evaporation."]],important:["Air is a mixture of gases.","Mixtures may be separated by filtration, evaporation or other physical methods.","A mixture does not have a fixed composition."],revision:["Mixtures are physical combinations; compounds are chemical combinations."]}
 ]
},

"CBSE|8|Science|The Amazing World of Solutes, Solvents, and Solutions": {

  {name:"Solutions and Their Components",explanation:"A solution is a homogeneous mixture. The solute dissolves in the solvent to form the solution.",definitions:[["Solution","A homogeneous mixture of solute and solvent."],["Solute","The substance that gets dissolved."],["Solvent","The substance that dissolves the solute."],["Solubility","The maximum amount of a solute that can dissolve in a given amount of solvent at a specified temperature."]],formulas:["Mass of solution = Mass of solute + Mass of solvent"],examples:[["In sugar water, identify solute and solvent.","Sugar is the solute; water is the solvent."]],important:["A solution has uniform composition.","Water is a common solvent.","Not all substances dissolve in every solvent."],revision:["Solute dissolves in solvent to form a solution."]},
  {name:"Concentration and Solubility",explanation:"Concentration describes how much solute is present in a given amount of solution. Solubility depends on the substances and often on temperature.",definitions:[["Concentration","The amount of solute present in a given amount of solution."],["Saturated solution","A solution that cannot dissolve more solute at a given temperature under the stated conditions."],["Unsaturated solution","A solution that can dissolve more solute at the same temperature."]],formulas:["Mass percentage = (Mass of solute ÷ Mass of solution) × 100"],examples:[["10 g salt is present in 100 g solution. Find mass percentage.","(10 ÷ 100) × 100 = 10%."]],important:["Stirring can increase the rate of dissolving.","Temperature affects solubility differently for different substances.","A saturated solution contains the maximum dissolved solute under stated conditions."],revision:["Concentration tells how much solute is present; solubility tells how much can dissolve."]}
 ]
},

  {name:"Reflection of Light",explanation:"Reflection occurs when light strikes a surface and returns into the same medium. Smooth surfaces produce regular reflection, while rough surfaces scatter reflected light.",definitions:[["Reflection","The bouncing back of light from a surface."],["Incident ray","The ray of light that falls on a surface."],["Reflected ray","The ray that leaves the surface after reflection."],["Normal","An imaginary line perpendicular to a surface at the point of incidence."]],formulas:["Angle of incidence = Angle of reflection"],examples:[["If the angle of incidence is 35°, what is the angle of reflection?","The angle of reflection is 35°."]],important:["The incident ray, reflected ray and normal lie in one plane.","Angles are measured from the normal.","A plane mirror forms an erect, virtual image."],revision:["Reflection follows the law: angle of incidence equals angle of reflection."]},

  {name:"A Tale of Valour",explanation:"The lesson presents courage and commitment through the story of Major Somnath Sharma and the Battle of Badgam. It highlights duty, leadership and dedication.",definitions:[["Valour","Great courage, especially in a difficult situation."],["Patriotism","Love and commitment towards one's country."],["Sacrifice","Giving up something valuable for a greater purpose."]],formulas:[],examples:[["What does courage mean in this lesson?","It means fulfilling one's responsibility with determination even in difficult circumstances."]],important:["The lesson honours courage and service.","Leadership includes responsibility towards others.","Historical events should be understood with respect and accuracy."],revision:["Courage, duty and commitment are central ideas."]},

"CBSE|8|English|Mystery and Magic": {

  {name:"The Case of the Fifth Word",explanation:"The story uses a mystery to encourage readers to examine clues and think logically. It shows the importance of careful reading and reasoning.",definitions:[["Mystery","Something that is difficult to explain or understand."],["Clue","A piece of information that helps solve a problem."],["Suspense","A feeling of excitement or uncertainty about what may happen."]],formulas:[],examples:[["How should a reader approach a mystery?","Notice details, compare clues and avoid making conclusions too early."]],important:["Small details may be important.","A good solution should explain the available clues.","Suspense keeps readers interested."],revision:["Use evidence and logical reasoning to understand a mystery."]},

"CBSE|8|Social Science|Natural Resources and Their Use": {
 summary:"Understand natural resources, their classification, distribution, conservation and responsible use.",
 topics:[
  {name:"Resources and Their Importance",explanation:"A resource is something that can satisfy human needs. A natural element becomes a resource when people have the knowledge, technology and ability to use it responsibly.",definitions:[["Resource","Anything that can be used to satisfy a need."],["Natural resource","A resource obtained from nature."],["Human-made resource","A resource created by people using natural materials and knowledge."],["Human resource","People and their knowledge, skills and abilities."]],formulas:[],examples:[["Why is sunlight a resource?","It provides energy and supports life, agriculture and solar power generation."]],important:["Resources have utility and value.","Technology can make previously inaccessible materials useful.","Responsible use prevents unnecessary depletion."],revision:["Resources are useful things that help meet human needs."]},
  {name:"Types of Natural Resources",explanation:"Natural resources can be classified in different ways. Renewable resources can be replenished naturally, while non-renewable resources form so slowly that their supply is limited on a human timescale.",definitions:[["Renewable resource","A resource that can be naturally replenished."],["Non-renewable resource","A resource that is limited and takes a very long time to form."],["Biotic resource","A resource obtained from living organisms."],["Abiotic resource","A resource obtained from non-living components of nature."]],formulas:[],examples:[["Classify sunlight and coal.","Sunlight is renewable; coal is non-renewable."]],important:["Forests and water need careful management.","Coal and petroleum are fossil fuels.","Renewable does not mean unlimited."],revision:["Resources may be renewable or non-renewable, biotic or abiotic."]},
  {name:"Resource Conservation",explanation:"Conservation means using resources carefully so that they remain available for future generations. Sustainable development balances human needs with environmental protection.",definitions:[["Conservation","Protection and careful use of resources."],["Sustainable development","Development that meets present needs without compromising future generations."],["Recycling","Processing used materials to make them useful again."]],formulas:[],examples:[["Give two ways to conserve water.","Repair leaking taps and collect rainwater where suitable."]],important:["Reduce, reuse and recycle.","Protect forests and wildlife habitats.","Avoid wasting electricity, water and materials."],revision:["Use resources responsibly and protect them for the future."]}
 ]
},

"CBSE|8|Social Science|Reshaping India's Political Map": {

  {name:"Regional Kingdoms and Empires",explanation:"Several regional powers developed across the subcontinent. The Delhi Sultanate, Vijayanagara Empire, Mughal Empire and other kingdoms influenced politics, trade, culture and administration.",definitions:[["Sultanate","A territory governed by a sultan."],["Regional power","A kingdom or political authority controlling a particular region."],["Administration","The system through which a state is governed."]],formulas:[],examples:[["Why was Vijayanagara important?","It became a major political and cultural centre in southern India."]],important:["The Delhi Sultanate ruled large parts of northern India at different times.","The Vijayanagara Empire was a major southern power.","The Mughal Empire expanded under several rulers."],revision:["Different kingdoms and empires shaped India's regional history."]},

  {name:"The Background of Maratha Power",explanation:"The Marathas emerged as a major political force in western India. Local geography, forts, regional networks and political developments contributed to their rise.",definitions:[["Maratha","A historical community and political power associated especially with western India."],["Fort","A fortified structure used for defence and administration."],["Swarajya","A term meaning self-rule or self-governance."]],formulas:[],examples:[["Why were forts important in the Maratha period?","Forts helped protect territories and served as strategic administrative centres."]],important:["The Sahyadri region was important to Maratha history.","Forts played an important role in defence.","Regional political conditions helped the Marathas grow in power."],revision:["Geography, leadership and regional conditions shaped Maratha growth."]},
  {name:"Chhatrapati Shivaji Maharaj",explanation:"Shivaji Maharaj established an independent Maratha kingdom and developed systems of administration. His coronation took place at Raigad in 1674.",definitions:[["Chhatrapati","A royal title used by Shivaji Maharaj."],["Coronation","A formal ceremony marking a ruler's accession."],["Swarajya","Self-rule."]],formulas:[],examples:[["When was Shivaji Maharaj crowned?","He was crowned in 1674 at Raigad."]],important:["Raigad was an important centre of Maratha power.","Shivaji Maharaj developed administrative arrangements for the kingdom.","His naval and fort policies were important to the state's security."],revision:["Shivaji Maharaj established and organised an independent Maratha state."]},
  {name:"Administration and Expansion",explanation:"The Maratha state developed systems for revenue, military organisation and regional administration. After Shivaji Maharaj, Maratha influence expanded under later leaders and the Peshwas.",definitions:[["Peshwa","A senior minister who became the chief executive authority in the Maratha administration."],["Revenue","Income collected by a government."],["Confederacy","An association of political groups or states that cooperate while retaining some independence."]],formulas:[],examples:[["What was the role of revenue administration?","It helped the state collect resources to support governance and public and military needs."]],important:["The Peshwas became influential in later Maratha politics.","Maratha influence spread to many parts of India.","The confederacy included several powerful houses."],revision:["Maratha power expanded through administration, leadership and regional alliances."]}
 ]
