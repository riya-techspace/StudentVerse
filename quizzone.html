<html lang="en">
<head>
<meta charset="UTF-8">

<title>Quiz Zone | StudentVerse</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h2>🎯 StudentVerse</h2>
    <a href="index.html">Home</a>
</header>

<section class="hero">
    <h1>Quiz Zone</h1>
    <p>Test your knowledge. Challenge yourself. Grow smarter.</p>
</section>

<section class="features-grid" id="boardSection">
    <div class="feature-card" onclick="selectBoard('CBSE')">
        <h2>CBSE</h2>
        <p>Continue with CBSE</p>
    </div>
    <div class="feature-card" onclick="selectBoard('ICSE/ISC')">
        <h2>ICSE / ISC</h2>
        <p>Continue with ICSE / ISC</p>
    </div>
</section>

<section id="classSection" style="display:none;">
    <h2>Select Your Class</h2>
    <div class="features-grid" id="classGrid"></div>
</section>

<section id="subjectSection" style="display:none;">
    <h2>Select Your Subject</h2>
    <div class="features-grid" id="subjectGrid"></div>
</section>

<section id="chapterSection" style="display:none;">
    <h2>Select Your Chapter</h2>
    <div class="features-grid" id="chapterGrid"></div>
</section>

<section id="quizSection" style="display:none;" class="feature-card">
    <h2 id="quizTitle"></h2>
    <p id="questionCount"></p>
    <h3 id="questionText"></h3>
    <div id="answerOptions"></div>
    <p id="feedback"></p>
    <button id="nextBtn" onclick="nextQuestion()">Submit Answer</button>
</section>

<section id="resultSection" style="display:none;" class="feature-card">
    <h1>🏆 Quiz Completed!</h1>
    <h2 id="finalScore"></h2>
    <p id="finalMessage"></p>
    <button onclick="location.reload()">Try Again</button>
</section>

<script>

let selectedBoard = "";
let selectedClass = "";
let selectedSubject = "";
let selectedChapter = "";

let currentQuestion = 0;
let score = 0;
let selectedAnswer = null;
let answered = false;
let activeQuestions = [];

const questionBank = {

    ],

            options: ["Watt", "Joule", "Newton", "Volt"],
            answer: "Watt"

            options: ["Barometer", "Thermometer", "Ammeter", "Voltmeter"],

        }
    ],

    "Chemistry": [

            question: "What is the chemical symbol of Oxygen?",
            options: ["Ox", "O", "Og", "On"],
            answer: "O"
        },
        {
            question: "What is the atomic number of Hydrogen?",
            options: ["1", "2", "3", "4"],
            answer: "1"
        },
        {
            question: "What is the chemical formula of water?",
            options: ["CO2", "H2O", "O2", "NaCl"],
            answer: "H2O"
        },
        {
            question: "Which gas do plants absorb during photosynthesis?",
            options: ["Oxygen", "Nitrogen", "Carbon dioxide", "Hydrogen"],
            answer: "Carbon dioxide"
        },
        {
            question: "What is the pH of pure water at room temperature (approximately)?",
            options: ["3", "5", "7", "10"],
            answer: "7"

    ],

    "Biology": [
        {
            question: "Which organelle is known as the powerhouse of the cell?",
            options: ["Nucleus", "Mitochondria", "Ribosome", "Golgi body"],
            answer: "Mitochondria"
        },
        {
            question: "Which pigment helps plants absorb light?",
            options: ["Haemoglobin", "Chlorophyll", "Melanin", "Keratin"],
            answer: "Chlorophyll"
        },
        {
            question: "What is the basic unit of life?",
            options: ["Tissue", "Organ", "Cell", "Atom"],
            answer: "Cell"
        },
        {
            question: "Which organ pumps blood?",
            options: ["Lungs", "Heart", "Kidney", "Liver"],
            answer: "Heart"
        },
        {
            question: "How many chambers does the human heart have?",
            options: ["2", "3", "4", "5"],

        }
    ],

    "Science": [
        {
            question: "Which planet is known as the Red Planet?",
            options: ["Venus", "Mars", "Jupiter", "Saturn"],

        },
        {
            question: "Which gas is essential for human respiration?",
            options: ["Oxygen", "Carbon dioxide", "Helium", "Neon"],
            answer: "Oxygen"
        },
        {
            question: "What is the freezing point of water at standard pressure?",
            options: ["0°C", "10°C", "50°C", "100°C"],
            answer: "0°C"
        },
        {
            question: "Which force pulls objects towards Earth?",
            options: ["Friction", "Magnetism", "Gravity", "Tension"],
            answer: "Gravity"
        },
        {
            question: "Which part of a plant absorbs water from soil?",
            options: ["Flower", "Roots", "Leaves", "Fruit"],
            answer: "Roots"
        }
    ],

    "English": [
        {
            question: "Which word is a noun?",
            options: ["Quickly", "Beautiful", "Teacher", "Run"],

        },
        {
            question: "Choose the synonym of 'Happy'.",
            options: ["Sad", "Joyful", "Angry", "Tired"],

        {

        {
            question: "What is the capital of India?",
            options: ["Mumbai", "Kolkata", "New Delhi", "Chennai"],
            answer: "New Delhi"
        },
        {

            options: ["Africa", "Asia", "Europe", "Australia"],
            answer: "Asia"
        },
        {
            question: "When did India become independent?",
            options: ["1942", "1945", "1947", "1950"],
            answer: "1947"
        },
        {
            question: "Which imaginary line divides Earth into Northern and Southern Hemispheres?",
            options: ["Tropic of Cancer", "Equator", "Prime Meridian", "Arctic Circle"],
            answer: "Equator"
        }

};

function shuffle(array) {
    let copy = [...array];

    for (let i = copy.length - 1; i > 0; i--) {
        let j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
    }

    return copy;
}

function selectBoard(board) {
    selectedBoard = board;

    document.getElementById("boardSection").style.display = "none";
    document.getElementById("classSection").style.display = "block";

    let grid = document.getElementById("classGrid");
    grid.innerHTML = "";

    for (let i = 6; i <= 12; i++) {
        let card = document.createElement("div");
        card.className = "feature-card";
        card.textContent = "Class " + i;
        card.onclick = function() {
            selectClass(i);
        };
        grid.appendChild(card);
    }
}

function selectClass(cls) {
    selectedClass = cls;

    document.getElementById("classSection").style.display = "none";
    document.getElementById("subjectSection").style.display = "block";

    let subjects = ["English", "Mathematics", "Science", "Social Science"];

    if (selectedClass >= 11) {
        subjects = ["English", "Physics", "Chemistry", "Mathematics", "Biology"];
    }

    let grid = document.getElementById("subjectGrid");
    grid.innerHTML = "";

    subjects.forEach(subject => {
        let card = document.createElement("div");
        card.className = "feature-card";
        card.textContent = subject;
        card.onclick = function() {
            selectSubject(subject);
        };
        grid.appendChild(card);
    });
}

function selectSubject(subject) {
    selectedSubject = subject;

    document.getElementById("subjectSection").style.display = "none";
    document.getElementById("chapterSection").style.display = "block";

    let chapters = [
        "Chapter 1",
        "Chapter 2",
        "Chapter 3",
        "Chapter 4",
        "Chapter 5"
    ];

    let grid = document.getElementById("chapterGrid");
    grid.innerHTML = "";

    chapters.forEach(chapter => {
        let card = document.createElement("div");
        card.className = "feature-card";
        card.textContent = chapter;
        card.onclick = function() {
            startQuiz(chapter);
        };
        grid.appendChild(card);
    });
}

function startQuiz(chapter) {
    selectedChapter = chapter;
    currentQuestion = 0;
    score = 0;

    activeQuestions = shuffle(questionBank[selectedSubject] || []).slice(0, 5);

    if (activeQuestions.length === 0) {
        alert("Questions for this subject are coming soon!");
        return;
    }

    document.getElementById("chapterSection").style.display = "none";
    document.getElementById("quizSection").style.display = "block";

    document.getElementById("quizTitle").textContent =
        selectedBoard + " | Class " + selectedClass + " | " +
        selectedSubject + " | " + selectedChapter;

    showQuestion();
}

function showQuestion() {
    selectedAnswer = null;
    answered = false;

    let q = activeQuestions[currentQuestion];

    document.getElementById("questionText").textContent = q.question;

    document.getElementById("questionCount").textContent =
        "Question " + (currentQuestion + 1) + " of " + activeQuestions.length;

    document.getElementById("feedback").textContent = "";

    let options = document.getElementById("answerOptions");
    options.innerHTML = "";

    shuffle(q.options).forEach(option => {
        let button = document.createElement("button");
        button.textContent = option;
        button.style.display = "block";
        button.style.margin = "10px 0";
        button.style.width = "100%";

        button.onclick = function() {
            chooseAnswer(option, button);
        };

        options.appendChild(button);
    });

    document.getElementById("nextBtn").textContent = "Submit Answer";
}

function chooseAnswer(answer, button) {
    if (answered) return;

    selectedAnswer = answer;

    document.querySelectorAll("#answerOptions button").forEach(btn => {
        btn.style.opacity = "0.6";
    });

    button.style.opacity = "1";
}

function nextQuestion() {
    if (answered) {
        currentQuestion++;

        if (currentQuestion < activeQuestions.length) {
            showQuestion();
        } else {
            showResult();
        }

        return;
    }

    if (selectedAnswer === null) {
        alert("Please select an answer first!");
        return;
    }

    answered = true;

    let correctAnswer = activeQuestions[currentQuestion].answer;
    let feedback = document.getElementById("feedback");

    if (selectedAnswer === correctAnswer) {
        score++;
        feedback.textContent = "Correct! 🎉 Well done.";
    } else {
        feedback.textContent = "Not quite! Correct answer: " + correctAnswer;
    }

    document.getElementById("nextBtn").textContent =
        currentQuestion === activeQuestions.length - 1
        ? "See Result"
        : "Next Question";
}

function showResult() {
    document.getElementById("quizSection").style.display = "none";
    document.getElementById("resultSection").style.display = "block";

    let percentage = Math.round((score / activeQuestions.length) * 100);

    document.getElementById("finalScore").textContent =
        "Your Score: " + score + " / " + activeQuestions.length;

    document.getElementById("finalMessage").textContent =
        "Percentage: " + percentage + "%";
}

</script>

</body>
</html>
